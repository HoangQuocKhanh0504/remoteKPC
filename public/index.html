<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KPC-computer - Remote Desktop</title>
    <link rel="icon" href="img/GD.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #010101;
            --bg-card: #0a0f16;
            --bg-elevated: #121824;
            --accent: #00ff88;
            --accent-dark: #00cc66;
            --text-primary: #f0f4fa;
            --text-secondary: #8e9eb5;
            --border-light: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: rgba(1, 1, 1, 0.96);
            backdrop-filter: blur(20px);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-light);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 14px;
        }
        
        .user-name {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .user-name span {
            color: var(--accent);
            font-weight: 600;
        }

        .mode-switch {
            display: flex;
            gap: 4px;
            background: var(--bg-elevated);
            padding: 2px;
            border-radius: 40px;
        }
        .mode-btn {
            padding: 4px 10px;
            border-radius: 32px;
            font-size: 10px;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #000;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 9px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff5e5e;
        }
        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 5px var(--accent);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .screen-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        .screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remote-screen {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.05s ease-out;
            will-change: transform;
            pointer-events: auto;
        }

        .float-dock {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 120;
        }
        .float-btn {
            width: 42px;
            height: 42px;
            background: rgba(18, 24, 36, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 0.5px solid var(--border-light);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .float-btn:active {
            transform: scale(0.92);
            background: var(--accent);
        }
        .float-btn.win-btn {
            background: linear-gradient(135deg, rgba(0, 200, 120, 0.25), rgba(0, 255, 136, 0.15));
            border: 1px solid rgba(0, 255, 136, 0.5);
            font-weight: 600;
            font-size: 20px;
            color: #00ffaa;
        }

        .control-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 15, 22, 0.98);
            backdrop-filter: blur(24px);
            border-radius: 24px 24px 0 0;
            transition: transform 0.28s ease;
            transform: translateY(calc(100% - 50px));
            z-index: 200;
            border-top: 0.5px solid var(--border-light);
        }
        .control-drawer.expanded {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 44px;
            height: 4px;
            background: #3a4454;
            border-radius: 3px;
            margin: 8px auto;
            cursor: pointer;
        }
        .drawer-content {
            padding: 4px 14px 18px;
            max-height: 46vh;
            overflow-y: auto;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: var(--bg-elevated);
            border: none;
            padding: 6px 14px;
            border-radius: 36px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-primary:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.95);
        }
        
        .btn-message {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 100, 0.1));
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .btn-message:active {
            background: var(--accent);
            color: #000;
        }

        .fps-control {
            background: var(--bg-elevated);
            border-radius: 28px;
            padding: 6px 12px;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .fps-label {
            font-size: 11px;
            font-weight: 500;
        }
        input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #2a3440;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }
        .fps-value {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            min-width: 42px;
        }
        .turbo-badge {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .feature-card {
            background: var(--bg-elevated);
            padding: 8px 3px;
            text-align: center;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.05s linear;
        }
        .feature-card:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.97);
        }

        .overlay-full {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            z-index: 300;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: flex;
            align-items: flex-end;
        }
        .overlay-full.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-drawer {
            background: var(--bg-card);
            width: 100%;
            max-height: 78vh;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 14px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 0.5px solid var(--border-light);
        }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
        }
        .modal-content-scroll {
            overflow-y: auto;
            padding: 16px 18px 28px;
            flex: 1;
        }
        .cmd-super-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .cmd-super {
            background: var(--bg-elevated);
            padding: 10px 4px;
            text-align: center;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.05s linear;
        }
        .cmd-super:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.97);
        }
        
        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            z-index: 400;
            width: 90%;
            max-width: 380px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid var(--border-light);
        }
        .message-popup.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .message-popup h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--accent);
            text-align: center;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
        }
        .popup-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .popup-buttons button {
            padding: 10px 24px;
            border-radius: 24px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 14px;
        }
        .popup-buttons button:active {
            transform: scale(0.95);
        }
        .btn-send {
            background: var(--accent);
            color: #000;
        }
        .btn-cancel {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }
        
        @media (min-width: 500px) {
            .feature-grid { grid-template-columns: repeat(4, 1fr); }
            .cmd-super-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .toast-fast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 5px 14px;
            border-radius: 36px;
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
            pointer-events: none;
            z-index: 400;
            transition: 0.15s;
            opacity: 0;
            white-space: nowrap;
        }
        .toast-fast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .info-badge {
            position: fixed;
            bottom: 10px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }
        .loader {
            position: fixed;
            inset: 0;
            background: #010101;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            gap: 10px;
        }
        .loader.show {
            visibility: visible;
            opacity: 1;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0,255,136,0.2);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .latency-bar {
            position: fixed;
            bottom: 10px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }
        
        .user-name-display {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-name-display span:first-child {
            color: var(--text-secondary);
        }
        .user-name-display span:last-child {
            color: var(--accent);
            font-weight: 600;
        }
        .edit-name-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
        }
        .edit-name-btn:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
            <div class="logo-area">
                <img src="img/GD.png" alt="Logo" class="logo-icon">
                <div class="logo-text">KPC</div>
            </div>
        <div class="user-name-display" id="userNameDisplay">
            <span>👤</span>
            <span id="displayName">Khách</span>
            <button class="edit-name-btn" id="editNameBtn">✎</button>
        </div>
        <div class="mode-switch">
            <button class="mode-btn" data-mode="touch">👆 Chạm</button>
            <button class="mode-btn" data-mode="scroll">📜 Cuộn</button>
            <button class="mode-btn" data-mode="drag">✋ Kéo</button>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">--</span>
        </div>
    </div>

    <div class="screen-area">
        <div class="screen-wrapper">
            <img id="remote-screen" draggable="false" alt="remote">
        </div>
    </div>

    <div class="float-dock">
        <div class="float-btn" id="menuBtn">⚙️</div>
        <div class="float-btn win-btn" id="winKeyBtn">⊞</div>
        <div class="float-btn" id="keyboardBtn">⌨️</div>
        <div class="float-btn" id="zoomPlus">➕</div>
        <div class="float-btn" id="zoomMinus">➖</div>
        <div class="float-btn" id="resetZoom">⟳</div>
    </div>

    <div class="control-drawer" id="controlDrawer">
        <div class="drawer-handle" id="drawerHandle"></div>
        <div class="drawer-content">
            <div class="btn-row">
                <button class="btn-primary" id="leftClick">🖱️ Trái</button>
                <button class="btn-primary" id="rightClick">🔘 Phải</button>
                <button class="btn-primary" id="doubleClick">⚡ Đúp</button>
                <button class="btn-primary btn-message" id="messageBtn">💬 Tin nhắn</button>
            </div>
            <div class="fps-control">
                <span class="fps-label">🚀 Turbo mode</span>
                <input type="range" id="fpsSlider" min="30" max="100" step="5" value="100">
                <span class="fps-value" id="fpsValueDisplay">100</span>
                <span class="turbo-badge" id="turboBadge">🔥 TURBO</span>
            </div>
            <div class="feature-grid" id="quickGrid"></div>
        </div>
    </div>

    <div class="overlay-full" id="advOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>🔥 Điều khiển nâng cao</span>
                <button class="close-btn" id="closeAdv">✕</button>
            </div>
            <div class="modal-content-scroll">
                <div class="cmd-super-grid" id="superGrid"></div>
            </div>
        </div>
    </div>

    <div class="overlay-full" id="kbdOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>⌨️ Bàn phím ảo</span>
                <button class="close-btn" id="closeKbd">✕</button>
            </div>
            <div class="modal-content-scroll">
                <div class="cmd-super-grid" id="vkbGrid" style="grid-template-columns: repeat(4,1fr);"></div>
            </div>
        </div>
    </div>

    <div class="message-popup" id="messagePopup">
        <h3>💬 Gửi tin nhắn</h3>
        <div class="input-group">
            <label>Tên của bạn</label>
            <input type="text" id="senderName" placeholder="Nhập tên của bạn...">
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="saveNameCheckbox">
            <label>Lưu tên để lần sau không cần nhập lại</label>
        </div>
        <div class="input-group">
            <label>Nội dung tin nhắn</label>
            <textarea id="messageInput" rows="3" placeholder="Nhập tin nhắn của bạn..."></textarea>
        </div>
        <div class="popup-buttons">
            <button class="btn-cancel" id="cancelMessage">Hủy</button>
            <button class="btn-send" id="sendMessage">Gửi</button>
        </div>
    </div>

    <div class="info-badge" id="infoBadge">📡 0 FPS | ⚡ 0ms</div>
    <div class="latency-bar" id="latencyBar">📶 0ms</div>
    <div class="toast-fast" id="toast"></div>
    <div class="loader" id="loader"><div class="spinner"></div><div>Đồng bộ...</div></div>
</div>

<script>
    let ws = null;
    let screenImg = document.getElementById('remote-screen');
    let screenW = 1920, screenH = 1080;
    let currentMode = 'touch';
    let isDragging = false;
    let scrollStartY = 0;
    let zoom = 1;
    let fps = 0, frameCount = 0, lastFpsTime = 0;
    let connected = false;
    let reconnectTimer = null;
    let connecting = false;
    let targetFPS = 100;
    let latency = 0;
    let lastPingTime = 0;
    let pingInterval = null;
    let mouseMoveThrottle = false;
    let lastMouseX = 960, lastMouseY = 540;
    let hasMousePos = false;
    let currentUserName = '';
    
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const loader = document.getElementById('loader');
    const toast = document.getElementById('toast');
    const controlDrawer = document.getElementById('controlDrawer');
    const advOverlay = document.getElementById('advOverlay');
    const kbdOverlay = document.getElementById('kbdOverlay');
    const infoBadge = document.getElementById('infoBadge');
    const latencyBar = document.getElementById('latencyBar');
    const fpsSlider = document.getElementById('fpsSlider');
    const fpsValueDisplay = document.getElementById('fpsValueDisplay');
    const turboBadge = document.getElementById('turboBadge');
    const messagePopup = document.getElementById('messagePopup');
    const messageInput = document.getElementById('messageInput');
    const senderNameInput = document.getElementById('senderName');
    const saveNameCheckbox = document.getElementById('saveNameCheckbox');
    const cancelMessage = document.getElementById('cancelMessage');
    const sendMessageBtn = document.getElementById('sendMessage');
    const displayNameSpan = document.getElementById('displayName');
    const editNameBtn = document.getElementById('editNameBtn');
    const messageBtn = document.getElementById('messageBtn');

    // Load saved name from localStorage
    function loadSavedName() {
        const savedName = localStorage.getItem('userName');
        if (savedName) {
            currentUserName = savedName;
            senderNameInput.value = savedName;
            displayNameSpan.textContent = savedName;
            saveNameCheckbox.checked = true;
        } else {
            currentUserName = 'Khách';
            senderNameInput.value = '';
            displayNameSpan.textContent = 'Khách';
            saveNameCheckbox.checked = false;
        }
    }
    
    // Save name to localStorage
    function saveUserName(name) {
        if (saveNameCheckbox.checked && name && name.trim() !== '') {
            localStorage.setItem('userName', name.trim());
            currentUserName = name.trim();
            displayNameSpan.textContent = currentUserName;
        } else if (!saveNameCheckbox.checked) {
            localStorage.removeItem('userName');
            currentUserName = name.trim() || 'Khách';
            displayNameSpan.textContent = currentUserName;
        }
    }
    
    // Update display name
    function updateDisplayName() {
        const savedName = localStorage.getItem('userName');
        if (savedName) {
            displayNameSpan.textContent = savedName;
            currentUserName = savedName;
        } else {
            displayNameSpan.textContent = 'Khách';
            currentUserName = 'Khách';
        }
    }
    
    // Edit name
    function editName() {
        const newName = prompt('Nhập tên của bạn:', currentUserName);
        if (newName && newName.trim() !== '') {
            currentUserName = newName.trim();
            displayNameSpan.textContent = currentUserName;
            senderNameInput.value = currentUserName;
            if (saveNameCheckbox.checked) {
                localStorage.setItem('userName', currentUserName);
            }
            showToast(`✅ Đã đổi tên thành: ${currentUserName}`);
        }
    }

    let toastTimer = null;
    function showToast(msg) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function updateConnection(status) {
        if (connected === status) return;
        connected = status;
        if (status) {
            statusDot.classList.add('connected');
            statusText.innerText = 'ON';
            loader.classList.remove('show');
            if (pingInterval) clearInterval(pingInterval);
            pingInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    lastPingTime = Date.now();
                    sendCommand('ping', {});
                }
            }, 2000);
        } else {
            statusDot.classList.remove('connected');
            statusText.innerText = 'OFF';
            loader.classList.add('show');
            if (pingInterval) clearInterval(pingInterval);
        }
    }

    function sendCommand(cmd, params = {}) {
        if (ws && ws.readyState === WebSocket.OPEN && connected) {
            try {
                ws.send(JSON.stringify({ type: 'command', command: cmd, ...params }));
                return true;
            } catch(e) {
                console.log('Send error:', e);
            }
        }
        return false;
    }

    function sendMessageToSystem(message, senderName) {
        if (!message || message.trim() === '') {
            showToast('⚠️ Vui lòng nhập tin nhắn');
            return false;
        }
        
        if (!senderName || senderName.trim() === '') {
            showToast('⚠️ Vui lòng nhập tên của bạn');
            senderNameInput.focus();
            return false;
        }
        
        const success = sendCommand('send_message', { 
            message: message.trim(),
            timestamp: Date.now(),
            sender: senderName.trim()
        });
        
        if (success) {
            showToast(`✅ Đã gửi tin nhắn từ "${senderName.trim()}"`);
            return true;
        } else {
            showToast('❌ Không thể gửi tin nhắn');
            return false;
        }
    }

    function openMessagePopup() {
        // Load saved name
        const savedName = localStorage.getItem('userName');
        if (savedName) {
            senderNameInput.value = savedName;
            saveNameCheckbox.checked = true;
        } else {
            senderNameInput.value = '';
            saveNameCheckbox.checked = false;
        }
        messageInput.value = '';
        messagePopup.classList.add('open');
        setTimeout(() => senderNameInput.focus(), 100);
    }

    function closeMessagePopup() {
        messagePopup.classList.remove('open');
    }

    function handleSendMessage() {
        const message = messageInput.value;
        const senderName = senderNameInput.value;
        
        // Save name if checkbox is checked
        if (saveNameCheckbox.checked && senderName && senderName.trim() !== '') {
            localStorage.setItem('userName', senderName.trim());
            currentUserName = senderName.trim();
            displayNameSpan.textContent = currentUserName;
        } else if (!saveNameCheckbox.checked) {
            localStorage.removeItem('userName');
            currentUserName = senderName.trim() || 'Khách';
            displayNameSpan.textContent = currentUserName;
        }
        
        if (sendMessageToSystem(message, senderName)) {
            closeMessagePopup();
        }
    }

    function setTargetFPS(fpsVal) {
        targetFPS = fpsVal;
        fpsValueDisplay.innerText = `${targetFPS}`;
        sendCommand('set_fps', { fps: targetFPS });
        if (targetFPS >= 85) {
            turboBadge.style.background = '#ff3366';
            turboBadge.style.color = '#fff';
            turboBadge.innerText = '⚡ EXTREME';
        } else if (targetFPS >= 60) {
            turboBadge.style.background = '#ffaa44';
            turboBadge.style.color = '#000';
            turboBadge.innerText = '🔥 TURBO';
        } else {
            turboBadge.style.background = '#00ff88';
            turboBadge.style.color = '#000';
            turboBadge.innerText = 'TURBO';
        }
    }

    fpsSlider.addEventListener('input', (e) => setTargetFPS(parseInt(e.target.value)));

    function getRealCoords(clientX, clientY) {
        const rect = screenImg.getBoundingClientRect();
        if (rect.width === 0) return { x: lastMouseX, y: lastMouseY };
        let rx = (clientX - rect.left) / rect.width;
        let ry = (clientY - rect.top) / rect.height;
        rx = Math.min(1, Math.max(0, rx));
        ry = Math.min(1, Math.max(0, ry));
        return { x: Math.floor(rx * screenW), y: Math.floor(ry * screenH) };
    }

    function updateMousePosition(clientX, clientY) {
        const coords = getRealCoords(clientX, clientY);
        lastMouseX = coords.x;
        lastMouseY = coords.y;
        hasMousePos = true;
    }

    function onTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const coords = getRealCoords(touch.clientX, touch.clientY);
        updateMousePosition(touch.clientX, touch.clientY);
        
        if (currentMode === 'scroll') {
            isDragging = true;
            scrollStartY = touch.clientY;
        } else if (currentMode === 'touch') {
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        } else if (currentMode === 'drag') {
            isDragging = true;
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        }
    }
    
    function onTouchMove(e) {
        e.preventDefault();
        if (!isDragging) return;
        const touch = e.touches[0];
        const coords = getRealCoords(touch.clientX, touch.clientY);
        updateMousePosition(touch.clientX, touch.clientY);
        
        if (currentMode === 'scroll') {
            const deltaY = scrollStartY - touch.clientY;
            if (Math.abs(deltaY) > 10) {
                let scrollDelta = Math.round(deltaY / 12);
                scrollDelta = Math.min(6, Math.max(-6, scrollDelta));
                if (scrollDelta !== 0) {
                    sendCommand('mouse_scroll', { delta: scrollDelta });
                }
                scrollStartY = touch.clientY;
            }
        } else if (currentMode === 'drag') {
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
        }
    }
    
    function onTouchEnd(e) {
        e.preventDefault();
        if (currentMode === 'drag' && isDragging) {
            sendCommand('mouse_click', { button: 'left' });
        }
        isDragging = false;
    }

    function handleMouseMove(e) {
        if (mouseMoveThrottle) return;
        mouseMoveThrottle = true;
        
        const coords = getRealCoords(e.clientX, e.clientY);
        updateMousePosition(e.clientX, e.clientY);
        if (currentMode === 'drag' && isDragging) {
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
        }
        
        setTimeout(() => { mouseMoveThrottle = false; }, 16);
    }
    
    function handleMouseClick(e, button) {
        e.preventDefault();
        const coords = getRealCoords(e.clientX, e.clientY);
        updateMousePosition(e.clientX, e.clientY);
        sendCommand('mouse_click', { x: coords.x, y: coords.y, button: button });
    }
    
    function handleMouseDragStart(e) {
        if (currentMode === 'drag') {
            e.preventDefault();
            isDragging = true;
            const coords = getRealCoords(e.clientX, e.clientY);
            updateMousePosition(e.clientX, e.clientY);
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        }
    }
    
    function handleMouseDragEnd(e) {
        if (currentMode === 'drag' && isDragging) {
            e.preventDefault();
            sendCommand('mouse_click', { button: 'left' });
            isDragging = false;
        }
    }

    function handleWheel(e) {
        e.preventDefault();
        let delta = e.deltaY > 0 ? -2 : 2;
        sendCommand('mouse_scroll', { delta: delta });
    }

    function clickAtSavedPosition(button) {
        if (!hasMousePos) {
            lastMouseX = screenW / 2;
            lastMouseY = screenH / 2;
            hasMousePos = true;
        }
        sendCommand('mouse_click', { x: lastMouseX, y: lastMouseY, button: button });
    }
    
    function doubleClickAtSavedPosition() {
        if (!hasMousePos) {
            lastMouseX = screenW / 2;
            lastMouseY = screenH / 2;
            hasMousePos = true;
        }
        sendCommand('mouse_double_click', { x: lastMouseX, y: lastMouseY });
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            if (btn.dataset.mode === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        const names = { touch:'Chạm', scroll:'Cuộn', drag:'Kéo' };
        showToast(`📱 Chế độ: ${names[mode]}`);
    }

    function zoomIn() { zoom = Math.min(3, zoom + 0.2); screenImg.style.transform = `scale(${zoom})`; }
    function zoomOut() { zoom = Math.max(0.5, zoom - 0.2); screenImg.style.transform = `scale(${zoom})`; }
    function resetZoomFunc() { zoom = 1; screenImg.style.transform = 'scale(1)'; }

    function sendAction(cmd) {
        if (cmd.includes('+')) {
            sendCommand('hotkey', { keys: cmd.split('+') });
        } else if (cmd === 'win') {
            sendCommand('hotkey', { keys: ['win'] });
        } else {
            sendCommand('key_press', { key: cmd });
        }
    }
    
    function sendWinKey() {
        sendCommand('hotkey', { keys: ['win'] });
    }

    function handleSpecialCommand(cmd) {
        if (cmd === "cmd_special") {
            sendCommand('hotkey', { keys: ['win', 'r'] });
            setTimeout(() => {
                sendCommand('key_type', { text: 'cmd' });
                setTimeout(() => sendCommand('key_press', { key: 'enter' }), 60);
            }, 80);
            return true;
        }
        return false;
    }

    const quickFeatures = [
        { name: "📋 Sao chép", cmd: "ctrl+c" }, { name: "📌 Dán", cmd: "ctrl+v" }, { name: "✂️ Cắt", cmd: "ctrl+x" },
        { name: "↩️ Hoàn tác", cmd: "ctrl+z" }, { name: "✅ Chọn hết", cmd: "ctrl+a" }, { name: "🖥️ Mở CMD", cmd: "cmd_special" },
        { name: "🔄 Alt+Tab", cmd: "alt+tab" }, { name: "🏠 Desktop", cmd: "win+d" }, { name: "📁 Explorer", cmd: "win+e" },
        { name: "⚙️ Run", cmd: "win+r" }, { name: "🔁 F5", cmd: "f5" }, { name: "❌ ESC", cmd: "esc" }, 
        { name: "↵ Enter", cmd: "enter" }, { name: "⊞ Win", cmd: "win" }, { name: "💬 Tin nhắn", cmd: "message" }
    ];

    const superAdvanced = [
        { name: "📋 Sao chép", cmd: "ctrl+c" }, { name: "📌 Dán", cmd: "ctrl+v" }, { name: "✂️ Cắt", cmd: "ctrl+x" },
        { name: "↩️ Hoàn tác", cmd: "ctrl+z" }, { name: "✅ Chọn hết", cmd: "ctrl+a" }, { name: "🔁 Làm lại", cmd: "ctrl+y" },
        { name: "💾 Lưu", cmd: "ctrl+s" }, { name: "🔍 Tìm", cmd: "ctrl+f" }, { name: "🔄 Alt+Tab", cmd: "alt+tab" },
        { name: "❌ Đóng cửa sổ", cmd: "alt+f4" }, { name: "🏠 Desktop", cmd: "win+d" }, { name: "⚙️ Run", cmd: "win+r" },
        { name: "📁 Explorer", cmd: "win+e" }, { name: "💻 Mở CMD", cmd: "cmd_special" }, { name: "📸 Chụp màn", cmd: "printscreen" },
        { name: "🔁 F5", cmd: "f5" }, { name: "🎬 F11", cmd: "f11" }, { name: "💬 Gửi tin nhắn", cmd: "message" },
        { name: "❌ ESC", cmd: "esc" }, { name: "↹ Tab", cmd: "tab" }, { name: "⌫ Delete", cmd: "delete" },
        { name: "⬆️ Lên", cmd: "up" }, { name: "⬇️ Xuống", cmd: "down" }, { name: "⬅️ Trái", cmd: "left" }, 
        { name: "➡️ Phải", cmd: "right" }, { name: "⏎ Enter", cmd: "enter" }, { name: "␣ Space", cmd: "space" }, 
        { name: "🔙 Backspace", cmd: "backspace" }, { name: "⊞ Win", cmd: "win" }
    ];

    function buildQuickGrid() {
        const container = document.getElementById('quickGrid');
        container.innerHTML = quickFeatures.map(f => `<div class="feature-card" data-qcmd="${f.cmd}">${f.name}</div>`).join('');
        document.querySelectorAll('[data-qcmd]').forEach(el => {
            el.addEventListener('click', () => {
                const cmd = el.dataset.qcmd;
                if (cmd === "cmd_special") handleSpecialCommand(cmd);
                else if (cmd === "win") sendWinKey();
                else if (cmd === "message") openMessagePopup();
                else sendAction(cmd);
            });
        });
    }

    function buildSuperGrid() {
        const container = document.getElementById('superGrid');
        container.innerHTML = superAdvanced.map(f => `<div class="cmd-super" data-scmd="${f.cmd}">${f.name}</div>`).join('');
        document.querySelectorAll('[data-scmd]').forEach(el => {
            el.addEventListener('click', () => {
                const cmd = el.dataset.scmd;
                if (cmd === "cmd_special") handleSpecialCommand(cmd);
                else if (cmd === "win") sendWinKey();
                else if (cmd === "message") {
                    advOverlay.classList.remove('open');
                    openMessagePopup();
                } else sendAction(cmd);
                advOverlay.classList.remove('open');
            });
        });
    }

    const keyboardKeys = ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','z','x','c','v','b','n','m',
        '1','2','3','4','5','6','7','8','9','0','-','=','[',']','\\',';',"'",',','.','/','␣','↵','⌫','⇥','⎋'];
    function buildVKB() {
        const grid = document.getElementById('vkbGrid');
        grid.innerHTML = keyboardKeys.map(key => {
            let display = key, sendVal = key;
            if (key === '␣') { display = '␣ Space'; sendVal = 'space'; }
            else if (key === '↵') { display = '↵ Enter'; sendVal = 'enter'; }
            else if (key === '⌫') { display = '⌫ Del'; sendVal = 'delete'; }
            else if (key === '⇥') { display = '⇥ Tab'; sendVal = 'tab'; }
            else if (key === '⎋') { display = '⎋ ESC'; sendVal = 'esc'; }
            return `<div class="cmd-super" data-vk="${sendVal}">${display}</div>`;
        }).join('');
        document.querySelectorAll('[data-vk]').forEach(el => {
            el.addEventListener('click', () => {
                let val = el.dataset.vk;
                if (val === 'space') sendCommand('key_press', { key: 'space' });
                else if (val === 'enter') sendCommand('key_press', { key: 'enter' });
                else if (val === 'tab') sendCommand('key_press', { key: 'tab' });
                else if (val === 'delete') sendCommand('key_press', { key: 'delete' });
                else if (val === 'esc') sendCommand('key_press', { key: 'esc' });
                else sendCommand('key_type', { text: val });
                kbdOverlay.classList.remove('open');
            });
        });
    }

    function connectWS() {
        if (connecting) return;
        connecting = true;
        
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}`;
        
        ws = new WebSocket(wsUrl);
        
        ws.onopen = () => { 
            connecting = false; 
            updateConnection(true); 
            sendCommand('set_fps', { fps: targetFPS }); 
            sendCommand('set_quality', { quality: 85 });
        };
        
        ws.onmessage = (ev) => {
            try {
                const data = JSON.parse(ev.data);
                
                if (data.type === 'pong') { 
                    latency = Date.now() - lastPingTime; 
                    latencyBar.innerText = `📶 ${latency}ms`; 
                    infoBadge.innerText = `📡 ${fps} FPS | ⚡ ${latency}ms`; 
                    return; 
                }
                
                if (data.type === 'screen') {
                    if (data.data) {
                        screenImg.src = 'data:image/jpeg;base64,' + data.data;
                    }
                    if (data.original_width) screenW = data.original_width;
                    if (data.original_height) screenH = data.original_height;
                    
                    frameCount++;
                    const nowFps = performance.now();
                    if (nowFps - lastFpsTime >= 1000) { 
                        fps = frameCount; 
                        frameCount = 0; 
                        lastFpsTime = nowFps; 
                        infoBadge.innerText = `📡 ${fps} FPS | ⚡ ${latency}ms`; 
                    }
                    
                    if (loader.classList.contains('show')) loader.classList.remove('show');
                } else if (data.type === 'status') {
                    updateConnection(data.connected);
                } else if (data.type === 'message_response') {
                    if (data.success) {
                        showToast(`✅ Tin nhắn đã được gửi đến hệ thống`);
                    } else {
                        showToast(`❌ Gửi tin nhắn thất bại`);
                    }
                }
            } catch(e) {
                console.log('Parse error:', e);
            }
        };
        
        ws.onclose = () => { 
            connecting = false; 
            updateConnection(false); 
            if (reconnectTimer) clearTimeout(reconnectTimer); 
            reconnectTimer = setTimeout(() => connectWS(), 3000);
        };
        
        ws.onerror = (e) => { 
            console.log('WebSocket error:', e);
            connecting = false; 
        };
    }

    function initUI() {
        document.getElementById('leftClick').onclick = () => clickAtSavedPosition('left');
        document.getElementById('rightClick').onclick = () => clickAtSavedPosition('right');
        document.getElementById('doubleClick').onclick = () => doubleClickAtSavedPosition();
        messageBtn.onclick = openMessagePopup;
        
        document.getElementById('menuBtn').onclick = () => advOverlay.classList.add('open');
        document.getElementById('keyboardBtn').onclick = () => kbdOverlay.classList.add('open');
        document.getElementById('winKeyBtn').onclick = sendWinKey;
        document.getElementById('zoomPlus').onclick = zoomIn;
        document.getElementById('zoomMinus').onclick = zoomOut;
        document.getElementById('resetZoom').onclick = resetZoomFunc;
        document.getElementById('closeAdv').onclick = () => advOverlay.classList.remove('open');
        document.getElementById('closeKbd').onclick = () => kbdOverlay.classList.remove('open');
        
        cancelMessage.onclick = closeMessagePopup;
        sendMessageBtn.onclick = handleSendMessage;
        editNameBtn.onclick = editName;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && messagePopup.classList.contains('open')) {
                closeMessagePopup();
            }
        });
        
        messagePopup.addEventListener('click', (e) => {
            if (e.target === messagePopup) {
                closeMessagePopup();
            }
        });
        
        let drawerExpanded = false;
        document.getElementById('drawerHandle').onclick = () => {
            drawerExpanded = !drawerExpanded;
            controlDrawer.classList.toggle('expanded', drawerExpanded);
        };
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.onclick = () => setMode(btn.dataset.mode));
        
        screenImg.addEventListener('touchstart', onTouchStart, { passive: false });
        screenImg.addEventListener('touchmove', onTouchMove, { passive: false });
        screenImg.addEventListener('touchend', onTouchEnd, { passive: false });
        screenImg.addEventListener('click', (e) => { if(currentMode === 'touch') handleMouseClick(e, 'left'); });
        screenImg.addEventListener('contextmenu', (e) => { e.preventDefault(); handleMouseClick(e, 'right'); return false; });
        screenImg.addEventListener('mousemove', handleMouseMove);
        screenImg.addEventListener('mousedown', handleMouseDragStart);
        screenImg.addEventListener('mouseup', handleMouseDragEnd);
        screenImg.addEventListener('wheel', handleWheel, { passive: false });
        
        showToast('✅ Đã sẵn sàng | 💬 Nhấn nút Tin nhắn để gửi thông báo');
    }

    // Load saved name on startup
    loadSavedName();
    updateDisplayName();
    
    buildQuickGrid();
    buildSuperGrid();
    buildVKB();
    initUI();
    connectWS();
    setMode('touch');
    setTargetFPS(100);
</script>
</body>
</html>

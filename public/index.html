<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KPC-computer</title>
    <link rel="icon" href="img/GD.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #010101;
            --bg-card: #0a0f16;
            --bg-elevated: #121824;
            --accent: #00ff88;
            --accent-dark: #00cc66;
            --text-primary: #f0f4fa;
            --text-secondary: #8e9eb5;
            --border-light: rgba(255,255,255,0.05);
            --audio-active: #ff6600;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: rgba(1, 1, 1, 0.96);
            backdrop-filter: blur(20px);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-light);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 14px;
        }

        .mode-switch {
            display: flex;
            gap: 4px;
            background: var(--bg-elevated);
            padding: 2px;
            border-radius: 40px;
        }
        .mode-btn {
            padding: 4px 10px;
            border-radius: 32px;
            font-size: 10px;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #000;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 9px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff5e5e;
        }
        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 5px var(--accent);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .screen-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        .screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remote-screen {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.05s ease-out;
            will-change: transform;
            pointer-events: auto;
        }

        .float-dock {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 120;
        }
        .float-btn {
            width: 42px;
            height: 42px;
            background: rgba(18, 24, 36, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 0.5px solid var(--border-light);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .float-btn:active {
            transform: scale(0.92);
            background: var(--accent);
        }
        .float-btn.win-btn {
            background: linear-gradient(135deg, rgba(0, 200, 120, 0.25), rgba(0, 255, 136, 0.15));
            border: 1px solid rgba(0, 255, 136, 0.5);
            font-weight: 600;
            font-size: 20px;
            color: #00ffaa;
        }
        .float-btn.audio-btn.active {
            background: var(--audio-active);
            color: #000;
            border-color: var(--audio-active);
            box-shadow: 0 0 12px rgba(255, 102, 0, 0.5);
        }

        .control-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 15, 22, 0.98);
            backdrop-filter: blur(24px);
            border-radius: 24px 24px 0 0;
            transition: transform 0.28s ease;
            transform: translateY(calc(100% - 50px));
            z-index: 200;
            border-top: 0.5px solid var(--border-light);
        }
        .control-drawer.expanded {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 44px;
            height: 4px;
            background: #3a4454;
            border-radius: 3px;
            margin: 8px auto;
            cursor: pointer;
        }
        .drawer-content {
            padding: 4px 14px 18px;
            max-height: 46vh;
            overflow-y: auto;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: var(--bg-elevated);
            border: none;
            padding: 6px 14px;
            border-radius: 36px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-primary:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.95);
        }
        .btn-primary.audio-toggle.active {
            background: var(--audio-active);
            color: #000;
        }

        .fps-control {
            background: var(--bg-elevated);
            border-radius: 28px;
            padding: 6px 12px;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .fps-label {
            font-size: 11px;
            font-weight: 500;
        }
        input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #2a3440;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }
        .fps-value {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            min-width: 42px;
        }
        .turbo-badge {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .feature-card {
            background: var(--bg-elevated);
            padding: 8px 3px;
            text-align: center;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .feature-card:active {
            background: var(--accent);
            color: #000;
        }

        .overlay-full {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            z-index: 300;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: flex;
            align-items: flex-end;
        }
        .overlay-full.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-drawer {
            background: var(--bg-card);
            width: 100%;
            max-height: 78vh;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 14px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 0.5px solid var(--border-light);
        }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
        }
        .modal-content-scroll {
            overflow-y: auto;
            padding: 16px 18px 28px;
            flex: 1;
        }
        .cmd-super-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .cmd-super {
            background: var(--bg-elevated);
            padding: 10px 4px;
            text-align: center;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .cmd-super:active {
            background: var(--accent);
            color: #000;
        }
        @media (min-width: 500px) {
            .feature-grid { grid-template-columns: repeat(4, 1fr); }
            .cmd-super-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .toast-fast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 5px 14px;
            border-radius: 36px;
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
            pointer-events: none;
            z-index: 400;
            transition: 0.15s;
            opacity: 0;
            white-space: nowrap;
        }
        .toast-fast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .info-badge {
            position: fixed;
            bottom: 10px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }
        .loader {
            position: fixed;
            inset: 0;
            background: #010101;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            gap: 10px;
        }
        .loader.show {
            visibility: visible;
            opacity: 1;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0,255,136,0.2);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .latency-bar {
            position: fixed;
            bottom: 10px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }

        .audio-visualizer {
            position: fixed;
            bottom: 70px;
            right: 8px;
            width: 50px;
            height: 40px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 95;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .audio-visualizer.active {
            opacity: 1;
        }
        .audio-bar {
            width: 5px;
            background: linear-gradient(to top, #00ff88, #ff6600);
            border-radius: 3px;
            transition: height 0.05s ease;
        }
        .audio-volume {
            position: fixed;
            bottom: 70px;
            right: 70px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-family: monospace;
            z-index: 95;
            display: none;
        }
        .audio-volume.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
<div class="logo-area">
    <img src="img/GD.png" alt="Logo" class="logo-icon">
    <div class="logo-text">KPC</div>
</div>
        <div class="mode-switch">
            <button class="mode-btn" data-mode="touch">👆 Chạm</button>
            <button class="mode-btn" data-mode="scroll">📜 Cuộn</button>
            <button class="mode-btn" data-mode="drag">✋ Kéo</button>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">--</span>
        </div>
    </div>

    <div class="screen-area">
        <div class="screen-wrapper">
            <img id="remote-screen" draggable="false" alt="remote">
        </div>
    </div>

    <div class="float-dock">
        <div class="float-btn" id="menuBtn">⚙️</div>
        <div class="float-btn win-btn" id="winKeyBtn">⊞</div>
        <div class="float-btn" id="keyboardBtn">⌨️</div>
        <div class="float-btn audio-btn" id="audioFloatBtn">🔇</div>
        <div class="float-btn" id="zoomPlus">➕</div>
        <div class="float-btn" id="zoomMinus">➖</div>
        <div class="float-btn" id="resetZoom">⟳</div>
    </div>

    <div class="control-drawer" id="controlDrawer">
        <div class="drawer-handle" id="drawerHandle"></div>
        <div class="drawer-content">
            <div class="btn-row">
                <button class="btn-primary" id="leftClick">🖱️ Trái</button>
                <button class="btn-primary" id="rightClick">🔘 Phải</button>
                <button class="btn-primary" id="doubleClick">⚡ Đúp</button>
                <button class="btn-primary audio-toggle" id="audioToggleBtn">🎧 Nghe âm thanh</button>
            </div>
            <div class="fps-control">
                <span class="fps-label">🚀 Turbo mode</span>
                <input type="range" id="fpsSlider" min="30" max="60" step="5" value="60">
                <span class="fps-value" id="fpsValueDisplay">60</span>
                <span class="turbo-badge" id="turboBadge">TURBO</span>
            </div>
            <div class="feature-grid" id="quickGrid"></div>
        </div>
    </div>

    <div class="overlay-full" id="advOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>🔥 Điều khiển nâng cao</span>
                <button class="close-btn" id="closeAdv">✕</button>
            </div>
            <div class="modal-content-scroll">
                <div class="cmd-super-grid" id="superGrid"></div>
            </div>
        </div>
    </div>

    <div class="overlay-full" id="kbdOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>⌨️ Bàn phím ảo</span>
                <button class="close-btn" id="closeKbd">✕</button>
            </div>
            <div class="modal-content-scroll">
                <div class="cmd-super-grid" id="vkbGrid" style="grid-template-columns: repeat(4,1fr);"></div>
            </div>
        </div>
    </div>

    <div class="audio-visualizer" id="audioVisualizer">
        <div class="audio-bar" id="bar1"></div>
        <div class="audio-bar" id="bar2"></div>
        <div class="audio-bar" id="bar3"></div>
        <div class="audio-bar" id="bar4"></div>
        <div class="audio-bar" id="bar5"></div>
        <div class="audio-bar" id="bar6"></div>
        <div class="audio-bar" id="bar7"></div>
    </div>
    <div class="audio-volume" id="audioVolume">🔊 0%</div>

    <div class="info-badge" id="infoBadge">📡 0 FPS | ⚡ 0ms</div>
    <div class="latency-bar" id="latencyBar">📶 0ms</div>
    <div class="toast-fast" id="toast"></div>
    <div class="loader" id="loader"><div class="spinner"></div><div>Đồng bộ...</div></div>
</div>

<script>
    let ws = null;
    let screenImg = document.getElementById('remote-screen');
    let screenW = 1920, screenH = 1080;
    let currentMode = 'touch';
    let isDragging = false;
    let scrollStartY = 0;
    let zoom = 1;
    let fps = 0, frameCount = 0, lastFpsTime = 0;
    let connected = false;
    let reconnectTimer = null;
    let connecting = false;
    let targetFPS = 60;
    let latency = 0;
    let lastPingTime = 0;
    let pingInterval = null;
    
    // Audio variables - FIXED VERSION
    let audioEnabled = false;
    let audioContext = null;
    let audioQueue = [];
    let isPlaying = false;
    let audioBuffer = null;
    let nextPlayTime = 0;
    let audioPacketsReceived = 0;
    let audioBytesReceived = 0;
    
    let lastMouseX = 960, lastMouseY = 540;
    let hasMousePos = false;
    
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const loader = document.getElementById('loader');
    const toast = document.getElementById('toast');
    const controlDrawer = document.getElementById('controlDrawer');
    const advOverlay = document.getElementById('advOverlay');
    const kbdOverlay = document.getElementById('kbdOverlay');
    const infoBadge = document.getElementById('infoBadge');
    const latencyBar = document.getElementById('latencyBar');
    const fpsSlider = document.getElementById('fpsSlider');
    const fpsValueDisplay = document.getElementById('fpsValueDisplay');
    const turboBadge = document.getElementById('turboBadge');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const audioFloatBtn = document.getElementById('audioFloatBtn');
    const audioVisualizer = document.getElementById('audioVisualizer');
    const audioVolumeDiv = document.getElementById('audioVolume');
    const audioBars = [
        document.getElementById('bar1'), document.getElementById('bar2'),
        document.getElementById('bar3'), document.getElementById('bar4'),
        document.getElementById('bar5'), document.getElementById('bar6'),
        document.getElementById('bar7')
    ];

    let toastTimer = null;
    function showToast(msg) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function updateConnection(status) {
        if (connected === status) return;
        connected = status;
        if (status) {
            statusDot.classList.add('connected');
            statusText.innerText = 'ON';
            loader.classList.remove('show');
            if (pingInterval) clearInterval(pingInterval);
            pingInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    lastPingTime = Date.now();
                    sendCommand('ping', {});
                }
            }, 1000);
        } else {
            statusDot.classList.remove('connected');
            statusText.innerText = 'OFF';
            loader.classList.add('show');
            if (pingInterval) clearInterval(pingInterval);
            if (audioEnabled) toggleAudio(false);
        }
    }

    function sendCommand(cmd, params = {}) {
        if (ws && ws.readyState === WebSocket.OPEN && connected) {
            ws.send(JSON.stringify({ type: 'command', command: cmd, ...params }));
            return true;
        }
        return false;
    }

    // Play PCM audio using Web Audio API - FIXED
    async function playPCMAudio(base64Data) {
        if (!audioEnabled || !audioContext) return;
        
        try {
            // Decode base64 to Int16Array
            const binaryStr = atob(base64Data);
            const pcmData = new Int16Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                pcmData[i] = binaryStr.charCodeAt(i);
            }
            
            audioPacketsReceived++;
            audioBytesReceived += binaryStr.length;
            
            // Calculate volume level for visualizer
            let sum = 0;
            for (let i = 0; i < Math.min(500, pcmData.length); i++) {
                sum += Math.abs(pcmData[i]);
            }
            const volume = Math.min(100, (sum / Math.min(500, pcmData.length) / 32768) * 100);
            audioVolumeDiv.innerHTML = `🔊 ${Math.floor(volume)}%`;
            audioVolumeDiv.classList.add('show');
            setTimeout(() => audioVolumeDiv.classList.remove('show'), 200);
            
            // Update visualizer
            updateAudioVisualizer(volume);
            
            // Create AudioBuffer
            const sampleRate = 44100;
            const duration = pcmData.length / sampleRate;
            const audioBuffer = audioContext.createBuffer(2, pcmData.length, sampleRate);
            
            // Convert Int16 to Float32
            const leftChannel = audioBuffer.getChannelData(0);
            const rightChannel = audioBuffer.getChannelData(1);
            
            for (let i = 0; i < pcmData.length; i++) {
                const sample = pcmData[i] / 32768.0;
                leftChannel[i] = sample;
                rightChannel[i] = sample;
            }
            
            // Schedule playback
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            
            // Schedule to minimize latency
            const now = audioContext.currentTime;
            if (nextPlayTime < now) {
                nextPlayTime = now;
            }
            source.start(nextPlayTime);
            nextPlayTime += duration;
            
            // Clean up old sources
            if (audioQueue.length > 10) {
                audioQueue.shift();
            }
            
        } catch (e) {
            console.error('Audio play error:', e);
        }
    }

    function updateAudioVisualizer(volume) {
        if (!audioEnabled) return;
        audioVisualizer.classList.add('active');
        
        const intensity = volume / 100;
        audioBars.forEach((bar, idx) => {
            const height = 3 + (intensity * 40) * (1 - idx * 0.1);
            bar.style.height = `${Math.max(3, Math.min(45, height))}px`;
        });
        
        setTimeout(() => {
            if (!audioEnabled) {
                audioVisualizer.classList.remove('active');
            } else {
                // Fade out if no audio for a while
                setTimeout(() => {
                    if (audioEnabled && audioPacketsReceived > 0) {
                        audioBars.forEach(bar => {
                            bar.style.height = '3px';
                        });
                    }
                }, 500);
            }
        }, 100);
    }

    async function toggleAudio(enable) {
        if (enable && !audioEnabled) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                // Initialize AudioContext (requires user interaction)
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    await audioContext.resume();
                    console.log('AudioContext initialized, state:', audioContext.state);
                }
                
                // Reset audio stats
                audioPacketsReceived = 0;
                audioBytesReceived = 0;
                nextPlayTime = 0;
                
                sendCommand('audio_enable', { enabled: true });
                audioEnabled = true;
                updateAudioUI(true);
                showToast('🎵 Đã bật âm thanh PC - Đang nhận dữ liệu...');
                
                // Test if audio is working
                setTimeout(() => {
                    if (audioPacketsReceived === 0) {
                        showToast('⚠️ Chưa nhận được dữ liệu âm thanh. Kiểm tra Stereo Mix!');
                    } else {
                        showToast(`✅ Đã nhận ${audioPacketsReceived} gói âm thanh (${Math.floor(audioBytesReceived/1024)} KB)`);
                    }
                }, 3000);
            } else {
                showToast('⚠️ Chưa kết nối RDP');
            }
        } else if (!enable && audioEnabled) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                sendCommand('audio_enable', { enabled: false });
            }
            if (audioContext) {
                await audioContext.close();
                audioContext = null;
            }
            audioEnabled = false;
            updateAudioUI(false);
            showToast('🔇 Đã tắt âm thanh');
            audioVolumeDiv.classList.remove('show');
            audioVisualizer.classList.remove('active');
        }
    }

    function updateAudioUI(enabled) {
        if (enabled) {
            audioToggleBtn.classList.add('active');
            audioToggleBtn.innerHTML = '🎵 Đang nghe';
            audioFloatBtn.classList.add('active');
            audioFloatBtn.innerHTML = '🎵';
        } else {
            audioToggleBtn.classList.remove('active');
            audioToggleBtn.innerHTML = '🎧 Nghe âm thanh';
            audioFloatBtn.classList.remove('active');
            audioFloatBtn.innerHTML = '🔇';
            audioVisualizer.classList.remove('active');
        }
    }

    function setTargetFPS(fpsVal) {
        targetFPS = fpsVal;
        fpsValueDisplay.innerText = `${targetFPS}`;
        sendCommand('set_fps', { fps: targetFPS });
        if (targetFPS >= 55) {
            turboBadge.style.background = '#ffaa44';
            turboBadge.innerText = '🔥 TURBO';
        } else {
            turboBadge.style.background = '#00ff88';
            turboBadge.innerText = 'TURBO';
        }
    }

    fpsSlider.addEventListener('input', (e) => setTargetFPS(parseInt(e.target.value)));

    function getRealCoords(clientX, clientY) {
        const rect = screenImg.getBoundingClientRect();
        if (rect.width === 0) return { x: lastMouseX, y: lastMouseY };
        let rx = (clientX - rect.left) / rect.width;
        let ry = (clientY - rect.top) / rect.height;
        rx = Math.min(1, Math.max(0, rx));
        ry = Math.min(1, Math.max(0, ry));
        return { x: Math.floor(rx * screenW), y: Math.floor(ry * screenH) };
    }

    function updateMousePosition(clientX, clientY) {
        const coords = getRealCoords(clientX, clientY);
        lastMouseX = coords.x;
        lastMouseY = coords.y;
        hasMousePos = true;
    }

    function onTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const coords = getRealCoords(touch.clientX, touch.clientY);
        updateMousePosition(touch.clientX, touch.clientY);
        
        if (currentMode === 'scroll') {
            isDragging = true;
            scrollStartY = touch.clientY;
        } else if (currentMode === 'touch') {
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        } else if (currentMode === 'drag') {
            isDragging = true;
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        }
    }
    
    function onTouchMove(e) {
        e.preventDefault();
        if (!isDragging) return;
        const touch = e.touches[0];
        const coords = getRealCoords(touch.clientX, touch.clientY);
        updateMousePosition(touch.clientX, touch.clientY);
        
        if (currentMode === 'scroll') {
            const deltaY = scrollStartY - touch.clientY;
            if (Math.abs(deltaY) > 10) {
                let scrollDelta = Math.round(deltaY / 12);
                scrollDelta = Math.min(6, Math.max(-6, scrollDelta));
                if (scrollDelta !== 0) {
                    sendCommand('mouse_scroll', { delta: scrollDelta });
                }
                scrollStartY = touch.clientY;
            }
        } else if (currentMode === 'drag') {
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
        }
    }
    
    function onTouchEnd(e) {
        e.preventDefault();
        if (currentMode === 'drag' && isDragging) {
            sendCommand('mouse_click', { button: 'left' });
        }
        isDragging = false;
    }

    function handleMouseMove(e) {
        const coords = getRealCoords(e.clientX, e.clientY);
        updateMousePosition(e.clientX, e.clientY);
        if (currentMode === 'drag' && isDragging) {
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
        }
    }
    
    function handleMouseClick(e, button) {
        e.preventDefault();
        const coords = getRealCoords(e.clientX, e.clientY);
        updateMousePosition(e.clientX, e.clientY);
        sendCommand('mouse_click', { x: coords.x, y: coords.y, button: button });
    }
    
    function handleMouseDragStart(e) {
        if (currentMode === 'drag') {
            e.preventDefault();
            isDragging = true;
            const coords = getRealCoords(e.clientX, e.clientY);
            updateMousePosition(e.clientX, e.clientY);
            sendCommand('mouse_move', { x: coords.x, y: coords.y });
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        }
    }
    
    function handleMouseDragEnd(e) {
        if (currentMode === 'drag' && isDragging) {
            e.preventDefault();
            sendCommand('mouse_click', { button: 'left' });
            isDragging = false;
        }
    }

    function handleWheel(e) {
        e.preventDefault();
        let delta = e.deltaY > 0 ? -2 : 2;
        sendCommand('mouse_scroll', { delta: delta });
    }

    function clickAtSavedPosition(button) {
        if (!hasMousePos) {
            lastMouseX = screenW / 2;
            lastMouseY = screenH / 2;
            hasMousePos = true;
        }
        sendCommand('mouse_click', { x: lastMouseX, y: lastMouseY, button: button });
    }
    
    function doubleClickAtSavedPosition() {
        if (!hasMousePos) {
            lastMouseX = screenW / 2;
            lastMouseY = screenH / 2;
            hasMousePos = true;
        }
        sendCommand('mouse_double_click', { x: lastMouseX, y: lastMouseY });
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            if (btn.dataset.mode === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        const names = { touch:'Chạm', scroll:'Cuộn', drag:'Kéo' };
        showToast(`📱 Chế độ: ${names[mode]}`);
    }

    function zoomIn() { zoom = Math.min(3, zoom + 0.2); screenImg.style.transform = `scale(${zoom})`; }
    function zoomOut() { zoom = Math.max(0.5, zoom - 0.2); screenImg.style.transform = `scale(${zoom})`; }
    function resetZoomFunc() { zoom = 1; screenImg.style.transform = 'scale(1)'; }

    function sendAction(cmd) {
        if (cmd.includes('+')) {
            sendCommand('hotkey', { keys: cmd.split('+') });
        } else if (cmd === 'win') {
            sendCommand('hotkey', { keys: ['win'] });
        } else {
            sendCommand('key_press', { key: cmd });
        }
    }
    
    function sendWinKey() {
        sendCommand('hotkey', { keys: ['win'] });
    }

    function handleSpecialCommand(cmd) {
        if (cmd === "cmd_special") {
            sendCommand('hotkey', { keys: ['win', 'r'] });
            setTimeout(() => {
                sendCommand('key_type', { text: 'cmd' });
                setTimeout(() => sendCommand('key_press', { key: 'enter' }), 60);
            }, 80);
            return true;
        }
        return false;
    }

    const quickFeatures = [
        { name: "📋 Sao chép", cmd: "ctrl+c" }, { name: "📌 Dán", cmd: "ctrl+v" }, { name: "✂️ Cắt", cmd: "ctrl+x" },
        { name: "↩️ Hoàn tác", cmd: "ctrl+z" }, { name: "✅ Chọn hết", cmd: "ctrl+a" }, { name: "🖥️ Mở CMD", cmd: "cmd_special" },
        { name: "🔄 Alt+Tab", cmd: "alt+tab" }, { name: "🏠 Desktop", cmd: "win+d" }, { name: "📁 Explorer", cmd: "win+e" },
        { name: "⚙️ Run", cmd: "win+r" }, { name: "🔁 F5", cmd: "f5" }, { name: "❌ ESC", cmd: "esc" }, { name: "↵ Enter", cmd: "enter" },
        { name: "⊞ Win", cmd: "win" }
    ];

    const superAdvanced = [
        { name: "📋 Sao chép", cmd: "ctrl+c" }, { name: "📌 Dán", cmd: "ctrl+v" }, { name: "✂️ Cắt", cmd: "ctrl+x" },
        { name: "↩️ Hoàn tác", cmd: "ctrl+z" }, { name: "✅ Chọn hết", cmd: "ctrl+a" }, { name: "🔁 Làm lại", cmd: "ctrl+y" },
        { name: "💾 Lưu", cmd: "ctrl+s" }, { name: "🔍 Tìm", cmd: "ctrl+f" }, { name: "🔄 Alt+Tab", cmd: "alt+tab" },
        { name: "❌ Đóng cửa sổ", cmd: "alt+f4" }, { name: "🏠 Desktop", cmd: "win+d" }, { name: "⚙️ Run", cmd: "win+r" },
        { name: "📁 Explorer", cmd: "win+e" }, { name: "💻 Mở CMD", cmd: "cmd_special" }, { name: "📸 Chụp màn", cmd: "printscreen" },
        { name: "🎛️ Task Manager", cmd: "ctrl+shift+esc" }, { name: "🔁 F5", cmd: "f5" }, { name: "🎬 F11", cmd: "f11" },
        { name: "❌ ESC", cmd: "esc" }, { name: "↹ Tab", cmd: "tab" }, { name: "⌫ Delete", cmd: "delete" },
        { name: "⬆️ Lên", cmd: "up" }, { name: "⬇️ Xuống", cmd: "down" }, { name: "⬅️ Trái", cmd: "left" }, { name: "➡️ Phải", cmd: "right" },
        { name: "⏎ Enter", cmd: "enter" }, { name: "␣ Space", cmd: "space" }, { name: "🔙 Backspace", cmd: "backspace" }, { name: "⊞ Win", cmd: "win" }
    ];

    function buildQuickGrid() {
        const container = document.getElementById('quickGrid');
        container.innerHTML = quickFeatures.map(f => `<div class="feature-card" data-qcmd="${f.cmd}">${f.name}</div>`).join('');
        document.querySelectorAll('[data-qcmd]').forEach(el => {
            el.addEventListener('click', () => {
                const cmd = el.dataset.qcmd;
                if (cmd === "cmd_special") handleSpecialCommand(cmd);
                else if (cmd === "win") sendWinKey();
                else sendAction(cmd);
            });
        });
    }

    function buildSuperGrid() {
        const container = document.getElementById('superGrid');
        container.innerHTML = superAdvanced.map(f => `<div class="cmd-super" data-scmd="${f.cmd}">${f.name}</div>`).join('');
        document.querySelectorAll('[data-scmd]').forEach(el => {
            el.addEventListener('click', () => {
                const cmd = el.dataset.scmd;
                if (cmd === "cmd_special") handleSpecialCommand(cmd);
                else if (cmd === "win") sendWinKey();
                else sendAction(cmd);
                advOverlay.classList.remove('open');
            });
        });
    }

    const keyboardKeys = ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','z','x','c','v','b','n','m',
        '1','2','3','4','5','6','7','8','9','0','-','=','[',']','\\',';',"'",',','.','/','␣','↵','⌫','⇥','⎋'];
    function buildVKB() {
        const grid = document.getElementById('vkbGrid');
        grid.innerHTML = keyboardKeys.map(key => {
            let display = key, sendVal = key;
            if (key === '␣') { display = '␣ Space'; sendVal = 'space'; }
            else if (key === '↵') { display = '↵ Enter'; sendVal = 'enter'; }
            else if (key === '⌫') { display = '⌫ Del'; sendVal = 'delete'; }
            else if (key === '⇥') { display = '⇥ Tab'; sendVal = 'tab'; }
            else if (key === '⎋') { display = '⎋ ESC'; sendVal = 'esc'; }
            return `<div class="cmd-super" data-vk="${sendVal}">${display}</div>`;
        }).join('');
        document.querySelectorAll('[data-vk]').forEach(el => {
            el.addEventListener('click', () => {
                let val = el.dataset.vk;
                if (val === 'space') sendCommand('key_press', { key: 'space' });
                else if (val === 'enter') sendCommand('key_press', { key: 'enter' });
                else if (val === 'tab') sendCommand('key_press', { key: 'tab' });
                else if (val === 'delete') sendCommand('key_press', { key: 'delete' });
                else if (val === 'esc') sendCommand('key_press', { key: 'esc' });
                else sendCommand('key_type', { text: val });
                kbdOverlay.classList.remove('open');
            });
        });
    }

    function connectWS() {
        if (connecting) return;
        connecting = true;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}`;
        ws = new WebSocket(wsUrl);
        ws.onopen = () => { 
            connecting = false; 
            updateConnection(true); 
            sendCommand('set_fps', { fps: targetFPS }); 
            sendCommand('set_quality', { quality: 85 });
            console.log('WebSocket connected');
        };
        ws.onmessage = (ev) => {
            try {
                const data = JSON.parse(ev.data);
                if (data.type === 'pong') { 
                    latency = Date.now() - lastPingTime; 
                    latencyBar.innerText = `📶 ${latency}ms`; 
                    infoBadge.innerText = `📡 ${fps} FPS | ⚡ ${latency}ms | 🎵 ${audioPacketsReceived}`; 
                    return; 
                }
                if (data.type === 'screen') {
                    screenImg.src = 'data:image/jpeg;base64,' + data.data;
                    if (data.original_width) screenW = data.original_width;
                    if (data.original_height) screenH = data.original_height;
                    frameCount++;
                    const nowFps = performance.now();
                    if (nowFps - lastFpsTime >= 1000) { 
                        fps = frameCount; 
                        frameCount = 0; 
                        lastFpsTime = nowFps; 
                        infoBadge.innerText = `📡 ${fps} FPS | ⚡ ${latency}ms | 🎵 ${audioPacketsReceived}`; 
                    }
                    if (loader.classList.contains('show')) loader.classList.remove('show');
                } else if (data.type === 'status') {
                    updateConnection(data.connected);
                } else if (data.type === 'audio_data') {
                    // Play audio immediately
                    if (audioEnabled && data.data) {
                        playPCMAudio(data.data);
                    }
                } else if (data.type === 'audio_start') {
                    console.log('Audio stream started from server');
                    if (!audioEnabled) {
                        toggleAudio(true);
                    }
                } else if (data.type === 'audio_stop') {
                    console.log('Audio stream stopped from server');
                    if (audioEnabled) {
                        toggleAudio(false);
                    }
                }
            } catch(e) {
                console.log('Parse error:', e);
            }
        };
        ws.onclose = () => { 
            connecting = false; 
            updateConnection(false); 
            if (reconnectTimer) clearTimeout(reconnectTimer); 
            reconnectTimer = setTimeout(() => connectWS(), 2000);
            if (audioEnabled) toggleAudio(false);
        };
        ws.onerror = (e) => { 
            console.log('WebSocket error:', e);
            connecting = false; 
        };
    }

    function initUI() {
        document.getElementById('leftClick').onclick = () => clickAtSavedPosition('left');
        document.getElementById('rightClick').onclick = () => clickAtSavedPosition('right');
        document.getElementById('doubleClick').onclick = () => doubleClickAtSavedPosition();
        document.getElementById('audioToggleBtn').onclick = () => toggleAudio(!audioEnabled);
        document.getElementById('audioFloatBtn').onclick = () => toggleAudio(!audioEnabled);
        
        document.getElementById('menuBtn').onclick = () => advOverlay.classList.add('open');
        document.getElementById('keyboardBtn').onclick = () => kbdOverlay.classList.add('open');
        document.getElementById('winKeyBtn').onclick = sendWinKey;
        document.getElementById('zoomPlus').onclick = zoomIn;
        document.getElementById('zoomMinus').onclick = zoomOut;
        document.getElementById('resetZoom').onclick = resetZoomFunc;
        document.getElementById('closeAdv').onclick = () => advOverlay.classList.remove('open');
        document.getElementById('closeKbd').onclick = () => kbdOverlay.classList.remove('open');
        
        let drawerExpanded = false;
        document.getElementById('drawerHandle').onclick = () => {
            drawerExpanded = !drawerExpanded;
            controlDrawer.classList.toggle('expanded', drawerExpanded);
        };
        document.querySelectorAll('.mode-btn').forEach(btn => btn.onclick = () => setMode(btn.dataset.mode));
        
        screenImg.addEventListener('touchstart', onTouchStart, { passive: false });
        screenImg.addEventListener('touchmove', onTouchMove, { passive: false });
        screenImg.addEventListener('touchend', onTouchEnd, { passive: false });
        screenImg.addEventListener('click', (e) => { if(currentMode === 'touch') handleMouseClick(e, 'left'); });
        screenImg.addEventListener('contextmenu', (e) => { e.preventDefault(); handleMouseClick(e, 'right'); return false; });
        screenImg.addEventListener('mousemove', handleMouseMove);
        screenImg.addEventListener('mousedown', handleMouseDragStart);
        screenImg.addEventListener('mouseup', handleMouseDragEnd);
        screenImg.addEventListener('wheel', handleWheel, { passive: false });
        
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.ctrlKey && e.key === 'a') { e.preventDefault(); sendAction('ctrl+a'); }
            else if (e.ctrlKey && e.key === 'c') { e.preventDefault(); sendAction('ctrl+c'); }
            else if (e.ctrlKey && e.key === 'v') { e.preventDefault(); sendAction('ctrl+v'); }
        });
        
        document.querySelector('.screen-area').addEventListener('touchmove', (e) => { 
            if (e.target === screenImg || screenImg.contains(e.target)) e.preventDefault(); 
        }, { passive: false });
        
        showToast('✅ Kéo thanh lên để mở menu điều khiển');
        
        // Auto-test audio on page load
        console.log('Audio ready, click the audio button to start');
    }

    buildQuickGrid();
    buildSuperGrid();
    buildVKB();
    initUI();
    connectWS();
    setMode('touch');
    setTargetFPS(60);
</script>
</body>
</html>

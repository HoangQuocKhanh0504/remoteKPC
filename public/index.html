<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KPC-computer - Remote Desktop</title>
    <link rel="icon" href="img/GD.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #010101;
            --bg-card: #0a0f16;
            --bg-elevated: #121824;
            --accent: #00ff88;
            --accent-dark: #00cc66;
            --text-primary: #f0f4fa;
            --text-secondary: #8e9eb5;
            --border-light: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .header {
            background: rgba(1, 1, 1, 0.96);
            backdrop-filter: blur(20px);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-light);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 14px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 9px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff5e5e;
        }
        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 5px var(--accent);
            animation: pulse 1s infinite;
        }
        .status-dot.reconnecting {
            background: #ffaa44;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .screen-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            touch-action: pan-x pan-y;
            min-height: 0;
        }
        .screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remote-screen {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.05s ease-out;
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .float-dock {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 120;
        }
        .float-btn {
            width: 44px;
            height: 44px;
            background: rgba(18, 24, 36, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 0.5px solid var(--border-light);
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .float-btn:active {
            transform: scale(0.92);
            background: var(--accent);
        }
        .float-btn.win-btn {
            background: linear-gradient(135deg, rgba(0, 200, 120, 0.25), rgba(0, 255, 136, 0.15));
            border: 1px solid rgba(0, 255, 136, 0.5);
            font-weight: 600;
            font-size: 20px;
            color: #00ffaa;
        }

        .control-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 15, 22, 0.98);
            backdrop-filter: blur(24px);
            border-radius: 24px 24px 0 0;
            transition: transform 0.28s ease;
            transform: translateY(calc(100% - 50px));
            z-index: 200;
            border-top: 0.5px solid var(--border-light);
        }
        .control-drawer.expanded {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 44px;
            height: 4px;
            background: #3a4454;
            border-radius: 3px;
            margin: 8px auto;
            cursor: pointer;
        }
        .drawer-content {
            padding: 4px 14px 18px;
            max-height: 46vh;
            overflow-y: auto;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: var(--bg-elevated);
            border: none;
            padding: 8px 16px;
            border-radius: 36px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.95);
        }
        
        .btn-message {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 100, 0.1));
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        
        .btn-lock {
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2), rgba(255, 59, 48, 0.1));
            border: 1px solid #ff3b30;
            color: #ff3b30;
        }
        
        .btn-unlock {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 100, 0.1));
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .fps-control {
            background: var(--bg-elevated);
            border-radius: 28px;
            padding: 6px 12px;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .fps-label {
            font-size: 11px;
            font-weight: 500;
        }
        input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #2a3440;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }
        .fps-value {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            min-width: 42px;
        }
        .turbo-badge {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .feature-card {
            background: var(--bg-elevated);
            padding: 10px 3px;
            text-align: center;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.05s linear;
            -webkit-tap-highlight-color: transparent;
        }
        .feature-card:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.97);
        }

        .overlay-full {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            z-index: 300;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: flex;
            align-items: flex-end;
        }
        .overlay-full.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-drawer {
            background: var(--bg-card);
            width: 100%;
            max-height: 78vh;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 14px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 0.5px solid var(--border-light);
        }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
        }
        .modal-content-scroll {
            overflow-y: auto;
            padding: 16px 18px 28px;
            flex: 1;
        }
        .cmd-super-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .cmd-super {
            background: var(--bg-elevated);
            padding: 12px 4px;
            text-align: center;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.05s linear;
            -webkit-tap-highlight-color: transparent;
        }
        .cmd-super:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.97);
        }
        
        .message-popup, .lock-popup, .unlock-popup, .web-popup, .rename-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            z-index: 400;
            width: 90%;
            max-width: 380px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid var(--border-light);
        }
        .message-popup.open, .lock-popup.open, .unlock-popup.open, .web-popup.open, .rename-popup.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .message-popup h3, .lock-popup h3, .unlock-popup h3, .web-popup h3, .rename-popup h3 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }
        .rename-popup h3 {
            color: var(--accent);
        }
        .lock-popup h3 {
            color: #ff3b30;
        }
        .unlock-popup h3 {
            color: #00ff88;
        }
        .web-popup h3 {
            color: #00aaff;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
        }
        .popup-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .popup-buttons button {
            padding: 10px 24px;
            border-radius: 24px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 14px;
        }
        .popup-buttons button:active {
            transform: scale(0.95);
        }
        .btn-send {
            background: var(--accent);
            color: #000;
        }
        .btn-lock-action {
            background: #ff3b30;
            color: #fff;
        }
        .btn-unlock-action {
            background: #00ff88;
            color: #000;
        }
        .btn-web-action {
            background: #00aaff;
            color: #fff;
        }
        .btn-rename {
            background: var(--accent);
            color: #000;
        }
        .btn-cancel {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }
        
        .pin-lock-ios {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            visibility: visible;
            opacity: 1;
            transition: opacity 0.2s ease;
            -webkit-overflow-scrolling: touch;
        }

        .pin-lock-ios.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .pin-container-ios {
            width: 100%;
            max-width: 320px;
            padding: 20px;
            margin: 0 auto;
        }

        .pin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .pin-title-ios {
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .pin-subtitle-ios {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .pin-dots-ios {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 48px;
        }

        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.1s ease;
        }

        .pin-dot.filled {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .pin-dot.error {
            background: #ff3b30;
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .pin-keypad-ios {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .pin-key-ios {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            font-size: 36px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            font-family: -apple-system, 'SF Pro Text', system-ui;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-key-ios:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .pin-key-ios.special {
            background: rgba(255, 255, 255, 0.08);
            font-size: 28px;
        }

        .pin-key-ios.delete:active {
            background: rgba(255, 59, 48, 0.4);
        }

        .pin-error-ios {
            text-align: center;
            color: #ff5e5e;
            font-size: 13px;
            min-height: 40px;
            font-weight: 500;
            padding: 8px;
        }

        .toast-fast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 36px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            pointer-events: none;
            z-index: 400;
            opacity: 0;
            white-space: nowrap;
            max-width: 80%;
            white-space: normal;
            text-align: center;
        }
        .toast-fast.show {
            opacity: 1;
        }
        .info-badge {
            position: fixed;
            bottom: 10px;
            left: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }
        .loader {
            position: fixed;
            inset: 0;
            background: #010101;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            gap: 10px;
        }
        .loader.show {
            visibility: visible;
            opacity: 1;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0,255,136,0.2);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .latency-bar {
            position: fixed;
            bottom: 10px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 8px;
            font-family: monospace;
            z-index: 90;
        }
        
        .user-name-display {
            background: var(--bg-elevated);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-name-display span:first-child {
            color: var(--text-secondary);
        }
        .user-name-display span:last-child {
            color: var(--accent);
            font-weight: 600;
        }
        .edit-name-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
        }
        
        .debug-panel {
            position: fixed;
            bottom: 50px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 9px;
            font-family: monospace;
            z-index: 95;
            color: #0f0;
            max-width: 200px;
            pointer-events: none;
        }
        
        .suggestions {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .suggestions span {
            display: inline-block;
            background: var(--bg-elevated);
            padding: 4px 8px;
            border-radius: 12px;
            margin: 4px 4px 0 0;
            cursor: pointer;
        }
        .suggestions span:active {
            background: var(--accent);
            color: #000;
        }
        
        @media (min-width: 500px) {
            .feature-grid { grid-template-columns: repeat(4, 1fr); }
            .cmd-super-grid { grid-template-columns: repeat(3, 1fr); }
            .pin-keypad-ios { gap: 20px; }
        }
        
        @media (max-width: 768px) {
            .pin-key-ios {
                min-height: 70px;
            }
            .float-btn {
                width: 48px;
                height: 48px;
            }
            .feature-card, .cmd-super {
                padding: 12px 4px;
            }
            .btn-primary {
                padding: 10px 18px;
                font-size: 13px;
            }
            .pin-title-ios {
                font-size: 28px;
            }
            .pin-dot {
                width: 16px;
                height: 16px;
            }
        }
        
        @media (max-width: 380px) {
            .pin-keypad-ios {
                gap: 12px;
            }
            .pin-key-ios {
                font-size: 28px;
            }
            .pin-container-ios {
                padding: 16px;
            }
            .pin-dots-ios {
                gap: 16px;
                margin-bottom: 32px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo-area">
            <img src="img/GD.png" alt="Logo" class="logo-icon">
            <div class="logo-text">KPC</div>
        </div>
        <div class="user-name-display" id="userNameDisplay">
            <span>👤</span>
            <span id="displayName">Khách</span>
            <button class="edit-name-btn" id="editNameBtn">✎</button>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">--</span>
        </div>
    </div>

    <div class="screen-area">
        <div class="screen-wrapper">
            <img id="remote-screen" draggable="false" alt="remote">
        </div>
    </div>

    <div class="float-dock">
        <div class="float-btn" id="menuBtn">⚙️</div>
        <div class="float-btn win-btn" id="winKeyBtn">⊞</div>
        <div class="float-btn" id="keyboardBtn">⌨️</div>
        <div class="float-btn" id="zoomPlus">➕</div>
        <div class="float-btn" id="zoomMinus">➖</div>
        <div class="float-btn" id="resetZoom">⟳</div>
    </div>

    <div class="control-drawer" id="controlDrawer">
        <div class="drawer-handle" id="drawerHandle"></div>
        <div class="drawer-content">
            <div class="btn-row">
                <button class="btn-primary btn-message" id="messageBtn">💬 Tin nhắn</button>
                <button class="btn-primary btn-lock" id="lockBtn">🔒 Khóa máy</button>
                <button class="btn-primary btn-unlock" id="unlockBtn">🔓 Mở khóa</button>
            </div>
            <div class="fps-control">
                <span class="fps-label">🚀 Turbo mode</span>
                <input type="range" id="fpsSlider" min="30" max="100" step="5" value="100">
                <span class="fps-value" id="fpsValueDisplay">100</span>
                <span class="turbo-badge" id="turboBadge">🔥 TURBO</span>
            </div>
            <div class="feature-grid" id="quickGrid"></div>
        </div>
    </div>

    <div class="overlay-full" id="advOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>🔥 Điều khiển nâng cao</span>
                <button class="close-btn" id="closeAdv">✕</button>
            </div>
            <div class="modal-content-scroll">
                <div class="cmd-super-grid" id="superGrid"></div>
            </div>
        </div>
    </div>

    <div class="overlay-full" id="kbdOverlay">
        <div class="modal-drawer">
            <div class="modal-header">
                <span>⌨️ Bàn phím ảo</span>

                <div class="pin-subtitle-ios">Nhập mã PIN 6 số</div>
            </div>
            <div class="pin-dots-ios" id="pinDots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <div class="pin-keypad-ios" id="pinKeypad"></div>
            <div class="pin-error-ios" id="pinError"></div>
        </div>

</div>

<script>
    (function() {
        // ========== BIẾN TOÀN CỤC ==========
        let ws = null;
        let screenImg = document.getElementById('remote-screen');
        let screenW = 1920, screenH = 1080;
        let zoom = 1;
        let fps = 0, frameCount = 0, lastFpsTime = 0;
        let connected = false;
        let reconnectTimer = null;
        let heartbeatInterval = null;
        let connecting = false;
        let targetFPS = 100;
        let latency = 0;
        let lastPingTime = 0;
        let pingInterval = null;
        let sessionId = null;
        let isAuthenticated = false;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 10;
        let messageQueue = [];
        let isManuallyClosed = false;
        
        // DOM
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');
        const toast = document.getElementById('toast');
        const controlDrawer = document.getElementById('controlDrawer');
        const advOverlay = document.getElementById('advOverlay');
        const kbdOverlay = document.getElementById('kbdOverlay');
        const infoBadge = document.getElementById('infoBadge');
        const latencyBar = document.getElementById('latencyBar');
        const fpsSlider = document.getElementById('fpsSlider');
        const fpsValueDisplay = document.getElementById('fpsValueDisplay');
        const turboBadge = document.getElementById('turboBadge');
        const messagePopup = document.getElementById('messagePopup');
        const lockPopup = document.getElementById('lockPopup');
        const unlockPopup = document.getElementById('unlockPopup');
        const webPopup = document.getElementById('webPopup');
        const renamePopup = document.getElementById('renamePopup');
        const newNameInput = document.getElementById('newNameInput');
        const cancelRename = document.getElementById('cancelRename');
        const saveRename = document.getElementById('saveRename');
        const messageInput = document.getElementById('messageInput');
        const senderNameInput = document.getElementById('senderName');
        const saveNameCheckbox = document.getElementById('saveNameCheckbox');
        const cancelMessage = document.getElementById('cancelMessage');
        const sendMessageBtn = document.getElementById('sendMessage');
        const displayNameSpan = document.getElementById('displayName');
        const editNameBtn = document.getElementById('editNameBtn');
        const messageBtn = document.getElementById('messageBtn');
        const lockBtn = document.getElementById('lockBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const debugPanel = document.getElementById('debugPanel');
        const pinLock = document.getElementById('pinLock');
        
        // Lock popup elements
        const lockSenderName = document.getElementById('lockSenderName');
        const lockMessage = document.getElementById('lockMessage');
        const lockPermanent = document.getElementById('lockPermanent');
        const lockDuration = document.getElementById('lockDuration');
        const lockDurationGroup = document.getElementById('lockDurationGroup');
        const cancelLock = document.getElementById('cancelLock');
        const sendLock = document.getElementById('sendLock');
        
        // Unlock popup elements
        const unlockSenderName = document.getElementById('unlockSenderName');
        const unlockNote = document.getElementById('unlockNote');
        const cancelUnlock = document.getElementById('cancelUnlock');
        const sendUnlock = document.getElementById('sendUnlock');
        
        // Web popup elements
        const webUrl = document.getElementById('webUrl');
        const cancelWeb = document.getElementById('cancelWeb');
        const sendWeb = document.getElementById('sendWeb');
        const suggestions = document.querySelectorAll('[data-url]');
        
        // PIN Auth variables
        let currentPin = '';
        let pinDots = document.getElementById('pinDots');
        let pinError = document.getElementById('pinError');
        let isVerifying = false;
        let authTimeout = null;
        
        // Xóa session storage khi tải lại trang
        localStorage.removeItem('remote_session');
        sessionId = null;
        
        // Xử lý checkbox khóa vĩnh viễn
        if (lockPermanent) {
            lockPermanent.addEventListener('change', function() {
                if (this.checked) {
                    if (lockDurationGroup) lockDurationGroup.style.display = 'none';
                    if (lockDuration) lockDuration.value = 0;
                } else {
                    if (lockDurationGroup) lockDurationGroup.style.display = 'block';
                    if (lockDuration) lockDuration.value = 5;
                }
            });
        }
        
        // Xử lý gợi ý link
        suggestions.forEach(suggestion => {
            suggestion.addEventListener('click', () => {
                const url = suggestion.getAttribute('data-url');
                if (webUrl) webUrl.value = url;
            });
        });
        
        function updateDebug(msg) {
            if (debugPanel) {
                debugPanel.innerHTML = msg;
                setTimeout(() => {
                    if (debugPanel && debugPanel.innerHTML === msg) {
                        debugPanel.innerHTML = '🔍 Ready';
                    }
                }, 3000);
            }
        }
        
        function hapticFeedback() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }
        
        // ========== HÀM LẤY TỌA ĐỘ ==========
        function getRemoteCoordinates(clientX, clientY) {
            if (!screenImg) return null;
            const rect = screenImg.getBoundingClientRect();
            if (!rect.width || !rect.height) return null;
            
            let imgDisplayWidth = rect.width;
            let imgDisplayHeight = rect.height;
            let offsetX = rect.left;
            let offsetY = rect.top;
            
            let x = (clientX - offsetX) / imgDisplayWidth;
            let y = (clientY - offsetY) / imgDisplayHeight;
            
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));
            
            const remoteX = Math.round(x * screenW);
            const remoteY = Math.round(y * screenH);
            
            return { x: remoteX, y: remoteY };
        }
        
        // ========== GỬI LỆNH VỚI HÀNG ĐỢI ==========
        function sendCommand(cmd, params) {
            params = params || {};
            
            if (ws && ws.readyState === WebSocket.OPEN && isAuthenticated) {
                const msg = { type: 'command', command: cmd, ...params, session_id: sessionId, timestamp: Date.now() };
                try {
                    ws.send(JSON.stringify(msg));
                    console.log(`📤 Gửi lệnh: ${cmd}`);
                    return true;
                } catch(e) {
                    console.error('Lỗi gửi lệnh:', e);
                    if (isAuthenticated) {
                        messageQueue.push({ cmd, params, timestamp: Date.now() });
                        console.log(`📦 Thêm vào hàng đợi: ${cmd}, tổng: ${messageQueue.length}`);
                    }
                    return false;
                }
            } else if (isAuthenticated) {
                messageQueue.push({ cmd, params, timestamp: Date.now() });
                console.log(`📦 Thêm vào hàng đợi (mất kết nối): ${cmd}, tổng: ${messageQueue.length}`);
                showToast('⏳ Đang kết nối lại...');
                return false;
            }
            return false;
        }
        
        function processMessageQueue() {
            if (messageQueue.length === 0) return;
            
            console.log(`🔄 Đang xử lý ${messageQueue.length} lệnh trong hàng đợi...`);
            const queueToProcess = [...messageQueue];
            messageQueue = [];
            
            queueToProcess.forEach((item, index) => {
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN && isAuthenticated) {
                        const msg = { type: 'command', command: item.cmd, ...item.params, session_id: sessionId, timestamp: Date.now() };
                        try {
                            ws.send(JSON.stringify(msg));
                            console.log(`📤 Gửi lệnh từ hàng đợi: ${item.cmd}`);
                        } catch(e) {
                            console.error('Lỗi gửi lệnh từ hàng đợi:', e);
                            messageQueue.push(item);
                        }
                    } else {
                        messageQueue.push(item);
                    }
                }, index * 100);
            });
        }
        
        // ========== HEARTBEAT ==========
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN && isAuthenticated) {
                    try {
                        ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                        console.log('💓 Heartbeat sent');
                    } catch(e) {
                        console.log('Heartbeat failed:', e);
                    }
                }
            }, 15000);
        }
        
        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }
        
        // ========== XỬ LÝ CHẠM ==========
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const coords = getRemoteCoordinates(touch.clientX, touch.clientY);
            if (!coords) return;
            
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
            hapticFeedback();
            showToast(`🖱️ Click`);
            updateDebug(`Click (${coords.x},${coords.y})`);
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
        }
        
        function handleMouseDown(e) {
            e.preventDefault();
            const coords = getRemoteCoordinates(e.clientX, e.clientY);
            if (!coords) return;
            
            sendCommand('mouse_click', { x: coords.x, y: coords.y, button: 'left' });
        }
        
        function bindScreenEvents() {
            if (!screenImg) return;
            screenImg.addEventListener('contextmenu', (e) => e.preventDefault());
            screenImg.addEventListener('touchstart', handleTouchStart, { passive: false });
            screenImg.addEventListener('touchmove', handleTouchMove, { passive: false });
            screenImg.addEventListener('touchend', handleTouchEnd);
            screenImg.addEventListener('mousedown', handleMouseDown);
        }
        
        // ========== PIN AUTH ==========
        function updatePinDots() {
            if (!pinDots) return;
            const dots = pinDots.querySelectorAll('.pin-dot');
            const len = currentPin.length;
            for (let i = 0; i < dots.length; i++) {
                if (i < len) dots[i].classList.add('filled');
                else dots[i].classList.remove('filled');
                dots[i].classList.remove('error');
            }
        }
        
        function showPinError(msg) {
            if (pinError) pinError.textContent = msg || 'Mã PIN không đúng';
            if (pinError) pinError.style.color = '#ff5e5e';
            if (pinDots) {
                const dots = pinDots.querySelectorAll('.pin-dot');
                for (let i = 0; i < dots.length; i++) dots[i].classList.add('error');
            }
            
            if (window.pinErrorTimer) clearTimeout(window.pinErrorTimer);
            if (window.pinClearTimer) clearTimeout(window.pinClearTimer);
            
            window.pinErrorTimer = setTimeout(() => {
                if (pinDots) {
                    const dots = pinDots.querySelectorAll('.pin-dot');
                    for (let i = 0; i < dots.length; i++) dots[i].classList.remove('error');
                }
            }, 500);
            
            window.pinClearTimer = setTimeout(() => {
                currentPin = '';
                updatePinDots();
                if (pinError) pinError.textContent = '';
                isVerifying = false;
            }, 800);
        }
        
        function sendPinAuth() {
            if (currentPin.length !== 6) {
                showPinError('Vui lòng nhập đủ 6 số');
                return;
            }
            
            if (isVerifying) {
                console.log('Đang xác thực, vui lòng chờ...');
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showPinError('❌ Chưa kết nối đến server');
                return;
            }
            
            isVerifying = true;
            
            if (pinError) {
                pinError.textContent = '⏳ Đang xác thực...';
                pinError.style.color = '#00ff88';
            }
            
            if (authTimeout) clearTimeout(authTimeout);
            authTimeout = setTimeout(() => {
                if (isVerifying) {
                    isVerifying = false;
                    if (pinError) {
                        pinError.textContent = '⏱️ Hết thời gian chờ, thử lại';
                        pinError.style.color = '#ff5e5e';
                    }
                    currentPin = '';
                    updatePinDots();
                    setTimeout(() => {
                        if (pinError) pinError.textContent = '';
                    }, 2000);
                }
            }, 10000);
            
            try {
                const authMsg = JSON.stringify({ 
                    type: 'command', 
                    command: 'auth_pin', 
                    pin: currentPin 
                });
                ws.send(authMsg);
                console.log('📤 Đã gửi mã PIN xác thực');
            } catch(e) {
                console.error('Lỗi gửi PIN:', e);
                isVerifying = false;
                if (authTimeout) clearTimeout(authTimeout);
                showPinError('❌ Lỗi kết nối');
            }
        }
        
        function onPinKeyPress(keyValue) {
            if (isVerifying) {
                showToast('⏳ Đang xác thực, vui lòng chờ...');
                return;
            }
            
            if (keyValue === 'delete') {
                if (currentPin.length > 0) {
                    currentPin = currentPin.slice(0, -1);
                    updatePinDots();
                    if (pinError) {
                        pinError.textContent = '';
                        pinError.style.color = '#ff5e5e';
                    }
                }
            } else {
                if (currentPin.length < 6) {
                    currentPin += keyValue;
                    updatePinDots();
                    if (pinError) {
                        pinError.textContent = '';
                        pinError.style.color = '#ff5e5e';
                    }
                    
                    if (currentPin.length === 6) {
                        setTimeout(() => sendPinAuth(), 50);
                    }
                }
            }
        }
        
        function createKeypad() {
            const keypad = document.getElementById('pinKeypad');
            if (!keypad) return;
            const keys = [
                { value: '1', display: '1' }, { value: '2', display: '2' }, { value: '3', display: '3' },
                { value: '4', display: '4' }, { value: '5', display: '5' }, { value: '6', display: '6' },
                { value: '7', display: '7' }, { value: '8', display: '8' }, { value: '9', display: '9' },
                { value: '', display: '', empty: true },
                { value: '0', display: '0' }, { value: 'delete', display: '⌫', special: true }
            ];
            let html = '';
            for (let i = 0; i < keys.length; i++) {
                const k = keys[i];
                if (k.empty) {
                    html += '<div class="pin-key-ios special" style="visibility: hidden;"></div>';
                } else {
                    let cls = 'pin-key-ios';
                    if (k.special) cls += ' special';
                    if (k.value === 'delete') cls += ' delete';
                    html += `<button class="${cls}" data-pin-key="${k.value}">${k.display}</button>`;
                }
            }
            keypad.innerHTML = html;
            const btns = keypad.querySelectorAll('[data-pin-key]');
            for (let i = 0; i < btns.length; i++) {
                const btn = btns[i];
                const val = btn.getAttribute('data-pin-key');
                btn.addEventListener('touchstart', (e) => { 
                    e.preventDefault(); 
                    onPinKeyPress(val); 
                });
                btn.addEventListener('click', (e) => { 
                    e.preventDefault(); 
                    onPinKeyPress(val); 
                });
            }
        }
        
        function showToast(msg) {
            if (!toast) return;
            if (window.toastTimer) clearTimeout(window.toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function hidePinLock() {
            if (pinLock) {
                pinLock.classList.add('hidden');
                document.body.style.overflow = '';
                document.body.style.position = '';
                document.body.style.width = '';
            }
        }
        
        function updateConnection(status) {
            if (connected === status) return;
            connected = status;
            if (status) {
                if (statusDot) {
                    statusDot.classList.add('connected');
                    statusDot.classList.remove('reconnecting');
                }
                if (statusText) statusText.innerText = 'ON';
                if (loader) loader.classList.remove('show');
            } else {
                if (statusDot) {
                    statusDot.classList.remove('connected');
                    statusDot.classList.add('reconnecting');
                }
                if (statusText) statusText.innerText = 'OFF';
                if (!isAuthenticated && loader) loader.classList.add('show');
            }
        }
        
        function setTargetFPS(fpsVal) {
            targetFPS = fpsVal;
            if (fpsValueDisplay) fpsValueDisplay.innerText = targetFPS;
            sendCommand('set_fps', { fps: targetFPS });
            if (turboBadge) {
                if (targetFPS >= 85) {
                    turboBadge.style.background = '#ff3366';
                    turboBadge.innerText = '⚡ EXTREME';
                } else if (targetFPS >= 60) {
                    turboBadge.style.background = '#ffaa44';
                    turboBadge.innerText = '🔥 TURBO';
                } else {
                    turboBadge.style.background = '#00ff88';
                    turboBadge.innerText = 'TURBO';
                }
            }
        }
        
        // ========== XỬ LÝ RECONNECT ==========
        function handleReconnect() {
            if (isManuallyClosed) return;
            
            if (reconnectTimer) clearTimeout(reconnectTimer);
            
            reconnectAttempts++;
            
            let delay = Math.min(30000, Math.pow(2, reconnectAttempts) * 1000);
            delay = Math.max(2000, delay);
            
            if (reconnectAttempts <= maxReconnectAttempts) {
                console.log(`🔄 Thử kết nối lại sau ${delay/1000}s (lần ${reconnectAttempts}/${maxReconnectAttempts})`);
                updateDebug(`🔄 Thử lại sau ${delay/1000}s...`);
                
                reconnectTimer = setTimeout(() => {
                    connectWS();
                }, delay);
            } else {
                console.log('❌ Đã đạt số lần thử tối đa');
                updateDebug('❌ Không thể kết nối, vui lòng tải lại trang');
                showToast('❌ Không thể kết nối server, vui lòng tải lại trang');
                
                setTimeout(() => {
                    reconnectAttempts = 0;
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        connectWS();
                    }
                }, 60000);
            }
        }
        
        function disconnectWS() {
            isManuallyClosed = true;
            stopHeartbeat();
            
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            
            if (pingInterval) {
                clearInterval(pingInterval);
                pingInterval = null;
            }
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            isAuthenticated = false;
            connecting = false;
            updateConnection(false);
            console.log('🔌 Đã ngắt kết nối');
        }
        
        // ========== WEBSOCKET ==========
        function connectWS() {
            if (connecting) {
                console.log('Đang kết nối, bỏ qua...');
                return;
            }
            
            if (isManuallyClosed) {
                console.log('Đã đóng thủ công, không tự động kết nối');
                return;
            }
            
            connecting = true;
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + location.host;
            
            console.log(`🔌 Đang kết nối đến ${wsUrl} (lần thử ${reconnectAttempts + 1})`);
            updateDebug(`🔌 Đang kết nối... (${reconnectAttempts + 1})`);
            
            ws = new WebSocket(wsUrl);
            
            let connectionTimeout = setTimeout(() => {
                if (ws && ws.readyState !== WebSocket.OPEN) {
                    console.log('❌ Kết nối timeout');
                    ws.close();
                    connecting = false;
                    handleReconnect();
                }
            }, 8000);
            
            ws.onopen = () => {
                clearTimeout(connectionTimeout);
                connecting = false;
                reconnectAttempts = 0;
                updateConnection(true);
                updateDebug('✅ Đã kết nối WebSocket');
                console.log('✅ WebSocket connected');
                
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        try {
                            ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                        } catch(e) {}
                    }
                }, 500);
            };
            
            ws.onmessage = (ev) => {
                try {
                    const data = JSON.parse(ev.data);
                    console.log('📨 Nhận:', data.type);
                    
                    if (data.type === 'auth_response') {
                        if (authTimeout) clearTimeout(authTimeout);
                        
                        if (data.success) {
                            sessionId = data.session_id;
                            isAuthenticated = true;
                            isVerifying = false;
                            hidePinLock();
                            showToast('✅ Xác thực thành công!');
                            
                            startHeartbeat();
                            
                            sendCommand('set_fps', { fps: targetFPS });
                            currentPin = '';
                            updatePinDots();
                            updateDebug('✅ Đã xác thực');
                            
                            setTimeout(() => processMessageQueue(), 500);
                            
                            setTimeout(() => {
                                if (ws && ws.readyState === WebSocket.OPEN) {
                                    ws.send(JSON.stringify({ type: 'client_ready', session_id: sessionId }));
                                }
                            }, 100);
                        } else {
                            isVerifying = false;
                            showPinError('❌ ' + (data.message || 'Mã PIN không đúng'));
                            currentPin = '';
                            updatePinDots();
                        }
                        return;
                    }
                    
                    if (!isAuthenticated && data.type !== 'auth_response') {
                        return;
                    }
                    
                    if (data.type === 'pong') {
                        const now = Date.now();
                        if (data.timestamp) {
                            latency = now - data.timestamp;
                        }
                        if (latencyBar) latencyBar.innerText = '📶 ' + (latency > 0 ? latency : 0) + 'ms';
                        if (infoBadge) infoBadge.innerText = '📡 ' + fps + ' FPS | ⚡ ' + latency + 'ms';
                        return;
                    }
                    
                    if (data.type === 'screen') {
                        if (data.data && screenImg) {
                            screenImg.src = 'data:image/jpeg;base64,' + data.data;
                        }
                        if (data.original_width) screenW = data.original_width;
                        if (data.original_height) screenH = data.original_height;
                        frameCount++;
                        const nowFps = performance.now();
                        if (nowFps - lastFpsTime >= 1000) {
                            fps = frameCount;
                            frameCount = 0;
                            lastFpsTime = nowFps;
                            if (infoBadge) infoBadge.innerText = '📡 ' + fps + ' FPS | ⚡ ' + latency + 'ms';
                        }
                        if (loader && loader.classList.contains('show')) loader.classList.remove('show');
                    } else if (data.type === 'status') {
                        updateConnection(data.connected);
                    } else if (data.type === 'message_response') {
                        showToast(data.success ? '✅ Tin nhắn đã gửi' : '❌ Gửi thất bại');
                    } else if (data.type === 'lock_response') {
                        showToast(data.success ? '✅ Đã gửi lệnh khóa máy' : '❌ Gửi thất bại');
                    } else if (data.type === 'unlock_response') {
                        showToast(data.success ? '✅ Đã gửi lệnh mở khóa' : '❌ Gửi thất bại');
                    } else if (data.type === 'error') {
                        console.error('Server error:', data.message);
                        showToast('⚠️ ' + (data.message || 'Lỗi server'));
                    }
                    
                } catch(e) { 
                    console.log('Lỗi parse message:', e); 
                }
            };
            
            ws.onclose = (event) => {
                clearTimeout(connectionTimeout);
                connecting = false;
                
                if (isAuthenticated) {
                    console.log('❌ Mất kết nối khi đang xác thực');
                    isAuthenticated = false;
                    stopHeartbeat();
                    showToast('⚠️ Mất kết nối server, đang kết nối lại...');
                }
                
                updateConnection(false);
                updateDebug(`❌ Mất kết nối (code: ${event.code})`);
                console.log(`WebSocket closed: ${event.code} - ${event.reason}`);
                
                if (!isManuallyClosed) {
                    handleReconnect();
                }
            };
            
            ws.onerror = (err) => { 
                console.log('WebSocket error:', err);
                connecting = false; 
                updateDebug('⚠️ Lỗi WebSocket'); 
            };
        }
        
        // ========== KHỞI TẠO UI ==========
        function initUI() {
            const savedName = localStorage.getItem('userName');
            if (savedName && displayNameSpan) displayNameSpan.innerText = savedName;

                editNameBtn.onclick = () => {
                    if (newNameInput) newNameInput.value = displayNameSpan ? displayNameSpan.innerText : '';
                    if (renamePopup) renamePopup.classList.add('open');
                };
            }
            
            if (cancelRename) {
                cancelRename.onclick = () => {
                    if (renamePopup) renamePopup.classList.remove('open');
                };
            }
            
            if (saveRename) {
                saveRename.onclick = () => {

                    const newName = newNameInput.value.trim();
                    if (newName && newName.length > 0) {
                        if (newName.length <= 30) {
                            localStorage.setItem('userName', newName);
                            if (displayNameSpan) displayNameSpan.innerText = newName;
                            showToast('✅ Đã đổi tên thành: ' + newName);
                            if (renamePopup) renamePopup.classList.remove('open');
                        } else {
                            showToast('⚠️ Tên không được quá 30 ký tự');
                        }
                    } else {
                        showToast('⚠️ Vui lòng nhập tên');
                    }
                };
            }
            
            if (newNameInput) {
                newNameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && saveRename) {
                        saveRename.click();
                    }
                });
            }
            
            if (messageBtn) {
                messageBtn.onclick = () => { 
                    if (messagePopup) messagePopup.classList.add('open');

                };
            }
            
            if (lockBtn) {
                lockBtn.onclick = () => {
                    if (lockPopup) lockPopup.classList.add('open');

                    if (lockPermanent) lockPermanent.checked = false;
                    if (lockDurationGroup) lockDurationGroup.style.display = 'block';
                    if (lockDuration) lockDuration.value = 5;
                };
            }
            
            if (unlockBtn) {
                unlockBtn.onclick = () => {
                    if (unlockPopup) unlockPopup.classList.add('open');

                    if (unlockNote) unlockNote.value = '';
                };
            }
            
            const menuBtn = document.getElementById('menuBtn');
            if (menuBtn) menuBtn.onclick = () => { if (advOverlay) advOverlay.classList.add('open'); };
            
            const keyboardBtn = document.getElementById('keyboardBtn');
            if (keyboardBtn) keyboardBtn.onclick = () => { if (kbdOverlay) kbdOverlay.classList.add('open'); };
            
            const winKeyBtn = document.getElementById('winKeyBtn');
            if (winKeyBtn) winKeyBtn.onclick = () => sendCommand('hotkey', { keys: ['win'] });
            
            const zoomPlus = document.getElementById('zoomPlus');
            if (zoomPlus) zoomPlus.onclick = () => { zoom = Math.min(3, zoom + 0.2); if (screenImg) screenImg.style.transform = 'scale(' + zoom + ')'; };
            
            const zoomMinus = document.getElementById('zoomMinus');
            if (zoomMinus) zoomMinus.onclick = () => { zoom = Math.max(0.5, zoom - 0.2); if (screenImg) screenImg.style.transform = 'scale(' + zoom + ')'; };
            
            const resetZoom = document.getElementById('resetZoom');
            if (resetZoom) resetZoom.onclick = () => { zoom = 1; if (screenImg) screenImg.style.transform = 'scale(1)'; };
            
            const closeAdv = document.getElementById('closeAdv');
            if (closeAdv) closeAdv.onclick = () => { if (advOverlay) advOverlay.classList.remove('open'); };
            
            const closeKbd = document.getElementById('closeKbd');
            if (closeKbd) closeKbd.onclick = () => { if (kbdOverlay) kbdOverlay.classList.remove('open'); };
            
            if (cancelMessage) {
                cancelMessage.onclick = () => { if (messagePopup) messagePopup.classList.remove('open'); };
            }
            
            if (cancelLock) {
                cancelLock.onclick = () => { if (lockPopup) lockPopup.classList.remove('open'); };
            }
            
            if (cancelUnlock) {
                cancelUnlock.onclick = () => { if (unlockPopup) unlockPopup.classList.remove('open'); };
            }
            
            if (cancelWeb) {
                cancelWeb.onclick = () => { if (webPopup) webPopup.classList.remove('open'); };
            }
            
            if (sendMessageBtn) {
                sendMessageBtn.onclick = () => {
                    const msg = messageInput ? messageInput.value : '';
                    const name = senderNameInput ? senderNameInput.value : '';
                    if (msg && msg.trim() && name && name.trim()) {
                        sendCommand('send_message', { message: msg.trim(), timestamp: Date.now(), sender: name.trim() });
                        if (saveNameCheckbox && saveNameCheckbox.checked && name.trim()) {
                            localStorage.setItem('userName', name.trim());
                            if (displayNameSpan) displayNameSpan.innerText = name.trim();
                        }
                        if (messagePopup) messagePopup.classList.remove('open');
                        showToast('✅ Đã gửi');
                    } else showToast('⚠️ Nhập đủ thông tin');
                };
            }
            
            if (sendLock) {
                sendLock.onclick = () => {
                    const name = lockSenderName ? lockSenderName.value : '';
                    const message = lockMessage ? lockMessage.value : '';
                    const permanent = lockPermanent ? lockPermanent.checked : false;
                    let duration = permanent ? 0 : (lockDuration ? parseInt(lockDuration.value) : 5);
                    
                    if (!name || !name.trim()) {
                        showToast('⚠️ Vui lòng nhập tên');
                        return;
                    }
                    
                    if (!permanent && (isNaN(duration) || duration < 1)) {
                        showToast('⚠️ Vui lòng nhập thời gian hợp lệ');
                        return;
                    }
                    
                    sendCommand('lock_screen', {
                        sender: name.trim(),
                        message: message.trim() || 'Không có lý do',
                        duration: duration,
                        timestamp: Date.now()
                    });
                    
                    if (lockPopup) lockPopup.classList.remove('open');
                    showToast(permanent ? '🔒 Đã gửi lệnh khóa vĩnh viễn' : `🔒 Đã gửi lệnh khóa ${duration} phút`);
                };
            }
            
            if (sendUnlock) {
                sendUnlock.onclick = () => {
                    const name = unlockSenderName ? unlockSenderName.value : '';
                    const note = unlockNote ? unlockNote.value : '';
                    
                    if (!name || !name.trim()) {
                        showToast('⚠️ Vui lòng nhập tên');
                        return;
                    }
                    
                    sendCommand('unlock_screen', {
                        sender: name.trim(),
                        note: note.trim() || 'Không có ghi chú',
                        timestamp: Date.now()
                    });
                    
                    if (unlockPopup) unlockPopup.classList.remove('open');
                    showToast('🔓 Đã gửi lệnh mở khóa');
                };
            }
            
            if (sendWeb) {
                sendWeb.onclick = () => {
                    let url = webUrl ? webUrl.value.trim() : '';
                    
                    if (!url) {
                        showToast('⚠️ Vui lòng nhập địa chỉ URL');
                        return;
                    }
                    
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    
                    sendCommand('open_url', {
                        url: url,
                        timestamp: Date.now()
                    });
                    
                    if (webPopup) webPopup.classList.remove('open');
                    showToast(`🌐 Đã gửi lệnh mở: ${url}`);
                };
            }
            
            let expanded = false;
            const drawerHandle = document.getElementById('drawerHandle');
            if (drawerHandle) {
                drawerHandle.onclick = () => {
                    expanded = !expanded;
                    if (controlDrawer) controlDrawer.classList.toggle('expanded', expanded);
                };
            }
            
            const quickFeat = [
                {name:"📋 Sao chép",cmd:"ctrl+c"},{name:"📌 Dán",cmd:"ctrl+v"},{name:"✂️ Cắt",cmd:"ctrl+x"},
                {name:"↩️ Hoàn tác",cmd:"ctrl+z"},{name:"✅ Chọn hết",cmd:"ctrl+a"},{name:"🖥️ Mở CMD",cmd:"cmd_special"},
                {name:"🔄 Alt+Tab",cmd:"alt+tab"},{name:"🏠 Desktop",cmd:"win+d"},{name:"📁 Explorer",cmd:"win+e"},
                {name:"⚙️ Run",cmd:"win+r"},{name:"🔁 F5",cmd:"f5"},{name:"❌ ESC",cmd:"esc"},
                {name:"↵ Enter",cmd:"enter"},{name:"⊞ Win",cmd:"win"},{name:"💬 Tin nhắn",cmd:"message"},
                {name:"🔒 Khóa máy",cmd:"lock"},{name:"🔓 Mở khóa",cmd:"unlock"},{name:"🌐 Mở web",cmd:"web"}
            ];
            const grid = document.getElementById('quickGrid');
            if (grid) {
                grid.innerHTML = quickFeat.map(f => `<div class="feature-card" data-qcmd="${f.cmd}">${f.name}</div>`).join('');
                document.querySelectorAll('[data-qcmd]').forEach(el => {
                    el.onclick = () => {
                        const c = el.dataset.qcmd;
                        if (c === 'cmd_special') {
                            sendCommand('hotkey', { keys: ['win', 'r'] });
                            setTimeout(() => sendCommand('key_type', { text: 'cmd' }), 80);
                            setTimeout(() => sendCommand('key_press', { key: 'enter' }), 140);
                        } else if (c === 'message') {
                            if (messagePopup) messagePopup.classList.add('open');
                        } else if (c === 'lock') {
                            if (lockPopup) lockPopup.classList.add('open');
                            if (lockSenderName) lockSenderName.value = localStorage.getItem('userName') || '';
                            if (lockPermanent) lockPermanent.checked = false;
                            if (lockDurationGroup) lockDurationGroup.style.display = 'block';
                            if (lockDuration) lockDuration.value = 5;
                        } else if (c === 'unlock') {
                            if (unlockPopup) unlockPopup.classList.add('open');
                            if (unlockSenderName) unlockSenderName.value = localStorage.getItem('userName') || '';
                        } else if (c === 'web') {
                            if (webPopup) webPopup.classList.add('open');
                            if (webUrl) webUrl.value = 'https://';
                        } else if (c === 'win') {
                            sendCommand('hotkey', { keys: ['win'] });
                        } else if (c.includes('+')) {
                            sendCommand('hotkey', { keys: c.split('+') });
                        } else {
                            sendCommand('key_press', { key: c });
                        }
                    };
                });
            }
            
            const superAdvanced = [
                {name:"📋 Sao chép",cmd:"ctrl+c"},{name:"📌 Dán",cmd:"ctrl+v"},{name:"✂️ Cắt",cmd:"ctrl+x"},
                {name:"↩️ Hoàn tác",cmd:"ctrl+z"},{name:"✅ Chọn hết",cmd:"ctrl+a"},{name:"🔁 Làm lại",cmd:"ctrl+y"},
                {name:"💾 Lưu",cmd:"ctrl+s"},{name:"🔍 Tìm",cmd:"ctrl+f"},{name:"🔄 Alt+Tab",cmd:"alt+tab"},
                {name:"❌ Đóng cửa sổ",cmd:"alt+f4"},{name:"🏠 Desktop",cmd:"win+d"},{name:"⚙️ Run",cmd:"win+r"},
                {name:"📁 Explorer",cmd:"win+e"},{name:"💻 Mở CMD",cmd:"cmd_special"},{name:"📸 Chụp màn",cmd:"printscreen"},
                {name:"🔁 F5",cmd:"f5"},{name:"🎬 F11",cmd:"f11"},{name:"💬 Gửi tin nhắn",cmd:"message"},
                {name:"🔒 Khóa máy",cmd:"lock"},{name:"🔓 Mở khóa",cmd:"unlock"},{name:"🌐 Mở web",cmd:"web"},
                {name:"❌ ESC",cmd:"esc"},{name:"↹ Tab",cmd:"tab"},{name:"⌫ Delete",cmd:"delete"},
                {name:"⬆️ Lên",cmd:"up"},{name:"⬇️ Xuống",cmd:"down"},{name:"⬅️ Trái",cmd:"left"},
                {name:"➡️ Phải",cmd:"right"},{name:"⏎ Enter",cmd:"enter"},{name:"␣ Space",cmd:"space"},
                {name:"🔙 Backspace",cmd:"backspace"},{name:"⊞ Win",cmd:"win"}
            ];
            const superGrid = document.getElementById('superGrid');
            if (superGrid) {
                superGrid.innerHTML = superAdvanced.map(f => `<div class="cmd-super" data-scmd="${f.cmd}">${f.name}</div>`).join('');
                document.querySelectorAll('[data-scmd]').forEach(el => {
                    el.onclick = () => {
                        const c = el.dataset.scmd;
                        if (c === 'cmd_special') {

                            setTimeout(() => sendCommand('key_type', { text: 'cmd' }), 80);

                        } else if (c === 'message') {

                            if (advOverlay) advOverlay.classList.remove('open');

                            if (lockPermanent) lockPermanent.checked = false;
                            if (lockDurationGroup) lockDurationGroup.style.display = 'block';
                            if (lockDuration) lockDuration.value = 5;
                        } else if (c === 'unlock') {
                            if (advOverlay) advOverlay.classList.remove('open');
                            if (unlockPopup) unlockPopup.classList.add('open');
                            if (unlockSenderName) unlockSenderName.value = localStorage.getItem('userName') || '';
                        } else if (c === 'web') {
                            if (advOverlay) advOverlay.classList.remove('open');
                            if (webPopup) webPopup.classList.add('open');
                            if (webUrl) webUrl.value = 'https://';
                        } else if (c === 'win') {
                            sendCommand('hotkey', { keys: ['win'] });
                        } else if (c.includes('+')) {
                            sendCommand('hotkey', { keys: c.split('+') });
                        } else {
                            sendCommand('key_press', { key: c });
                        }
                        if (advOverlay) advOverlay.classList.remove('open');
                    };
                });
            }
            
            const vkbKeys = ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','z','x','c','v','b','n','m','1','2','3','4','5','6','7','8','9','0','␣','↵','⌫'];
            const vkbGrid = document.getElementById('vkbGrid');
            if (vkbGrid) {
                vkbGrid.innerHTML = vkbKeys.map(k => {
                    let display = k, val = k;
                    if (k === '␣') { display = 'Space'; val = 'space'; }
                    else if (k === '↵') { display = 'Enter'; val = 'enter'; }
                    else if (k === '⌫') { display = 'Del'; val = 'delete'; }
                    return `<div class="cmd-super" data-vk="${val}">${display}</div>`;
                }).join('');
                document.querySelectorAll('[data-vk]').forEach(el => {
                    el.onclick = () => {
                        const v = el.dataset.vk;
                        if (v === 'space' || v === 'enter' || v === 'delete' || v === 'tab' || v === 'esc') {
                            sendCommand('key_press', { key: v });
                        } else {
                            sendCommand('key_type', { text: v });
                        }
                        if (kbdOverlay) kbdOverlay.classList.remove('open');
                    };
                });
            }
            
            if (fpsSlider) {
                fpsSlider.oninput = (e) => setTargetFPS(parseInt(e.target.value));
            }
            setTargetFPS(100);
        }
        
        // Xử lý khi trang bị đóng
        window.addEventListener('beforeunload', () => {
            disconnectWS();
        });
        
        // Xử lý khi app bị ẩn/hiện (iOS)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('App bị ẩn, tạm dừng heartbeat');
                if (pingInterval) clearInterval(pingInterval);
            } else {
                console.log('App hiển thị lại');
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN && isAuthenticated) {
                            lastPingTime = Date.now();
                            sendCommand('ping', {});
                        }
                    }, 3000);
                }
                if (ws && ws.readyState !== WebSocket.OPEN && !connecting && !isManuallyClosed) {
                    connectWS();
                }
            }
        });
        
        createKeypad();
        initUI();
        bindScreenEvents();
        connectWS();
        
        console.log('✅ App đã khởi tạo - Hỗ trợ iOS và Android với cơ chế kết nối ổn định');
        updateDebug('✅ Sẵn sàng! Vui lòng nhập PIN để bắt đầu');
    })();
